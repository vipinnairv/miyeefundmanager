/* ========================================================
   AMC P&L
   ======================================================== */
function PNL({ctx}){
  const { store, update } = ctx;
  const [editing, setEditing] = useState(null);
  const [type, setType] = useState('INCOME');

  function save(rec){
    const list = rec.kind==='INCOME'?'income':'expenses';
    if(rec.id){
      update(s => ({[list]: s[list].map(x=>x.id===rec.id?rec:x)}));
    } else {
      update(s => ({[list]: [...s[list], {...rec, id:uid(rec.kind)}]}));
    }
    setEditing(null);
  }
  function remove(rec){
    const list = rec.kind==='INCOME'?'income':'expenses';
    if(!confirm('Delete?')) return;
    update(s => ({[list]: s[list].filter(x=>x.id!==rec.id)}));
  }

  const totalInc = store.income.reduce((a,b)=>a+Number(b.amount||0),0);
  const totalExp = store.expenses.reduce((a,b)=>a+Number(b.amount||0),0);
  const net = totalInc - totalExp;

  // Group by category
  const incomeByCat = {}; store.income.forEach(i => incomeByCat[i.category||'Other']=(incomeByCat[i.category||'Other']||0)+Number(i.amount||0));
  const expByCat = {}; store.expenses.forEach(e => expByCat[e.category||'Other']=(expByCat[e.category||'Other']||0)+Number(e.amount||0));

  return (
    <div>
      <div className="kpi-grid">
        <div className="kpi"><div className="kpi-label">Total Income</div>
          <div className="kpi-value">{fmtINR(totalInc)}</div></div>
        <div className="kpi warn"><div className="kpi-label">Total Expenses</div>
          <div className="kpi-value">{fmtINR(totalExp)}</div></div>
        <div className="kpi accent"><div className="kpi-label">Net Profit / (Loss)</div>
          <div className={'kpi-value '+(net>=0?'pos':'neg')}>{fmtINR(net)}</div></div>
      </div>

      <div className="grid-2">
        <div className="card">
          <div className="card-head">
            <div>
              <div className="card-title">Income</div>
              <div className="card-sub">Management fees, transaction fees, advisory income</div>
            </div>
            <button className="btn btn-primary btn-sm" onClick={()=>setEditing({kind:'INCOME', date:todayISO()})}>+ Add</button>
          </div>
          <div className="tbl-wrap">
            <table className="tbl">
              <thead><tr><th>Date</th><th>Category</th><th>Narration</th><th className="num">Amount</th><th></th></tr></thead>
              <tbody>
                {store.income.length===0 && <tr><td colSpan="5"><div className="empty">No income recorded</div></td></tr>}
                {store.income.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).map(r => (
                  <tr key={r.id}>
                    <td>{fmtDate(r.date)}</td>
                    <td><span className="pill pill-green">{r.category}</span></td>
                    <td>{r.narration}</td>
                    <td className="num">{fmtINR(r.amount)}</td>
                    <td>
                      <button className="btn btn-sm" onClick={()=>setEditing(r)}>✎</button>
                      <button className="btn btn-sm btn-danger" onClick={()=>remove(r)}>×</button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>

        <div className="card">
          <div className="card-head">
            <div>
              <div className="card-title">Expenses</div>
              <div className="card-sub">Salaries, rent, audit, compliance, technology</div>
            </div>
            <button className="btn btn-primary btn-sm" onClick={()=>setEditing({kind:'EXPENSE', date:todayISO()})}>+ Add</button>
          </div>
          <div className="tbl-wrap">
            <table className="tbl">
              <thead><tr><th>Date</th><th>Category</th><th>Narration</th><th className="num">Amount</th><th></th></tr></thead>
              <tbody>
                {store.expenses.length===0 && <tr><td colSpan="5"><div className="empty">No expenses recorded</div></td></tr>}
                {store.expenses.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).map(r => (
                  <tr key={r.id}>
                    <td>{fmtDate(r.date)}</td>
                    <td><span className="pill pill-red">{r.category}</span></td>
                    <td>{r.narration}</td>
                    <td className="num">{fmtINR(r.amount)}</td>
                    <td>
                      <button className="btn btn-sm" onClick={()=>setEditing(r)}>✎</button>
                      <button className="btn btn-sm btn-danger" onClick={()=>remove(r)}>×</button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div className="card">
        <div className="card-head"><div className="card-title">Profit & Loss Statement</div></div>
        <div className="card-body">
          <table className="tbl">
            <tbody>

                <tr key={c}><td>{c}</td><td className="num">{fmtINR(v)}</td></tr>

/* ========================================================
   BALANCE SHEET
   ======================================================== */
function BalanceSheet({ctx}){
  const { store } = ctx;

  // Compute aggregates
  const schemeData = store.schemes.map(s => computeSchemeAUM(s,store));
  const totalAUM = schemeData.reduce((a,b)=>a+b.aum,0);
  const totalUnitCapital = schemeData.reduce((a,b)=>a+b.contribution,0);
  const totalUnrealised = totalAUM - totalUnitCapital;

  const totalInc = store.income.reduce((a,b)=>a+Number(b.amount||0),0);
  const totalExp = store.expenses.reduce((a,b)=>a+Number(b.amount||0),0);
  const retainedEarnings = totalInc - totalExp;

  // Asset class breakdown across all schemes
  const assetMV = {};
  schemeData.forEach(sd => Object.entries(sd.breakdown).forEach(([k,v])=>assetMV[k]=(assetMV[k]||0)+v));

  // AMC own books (simplistic)
  const cashOnHand = retainedEarnings; // simplification: net income held as cash
  const totalAssets = totalAUM + Math.max(0, cashOnHand);
  const totalLiabEquity = totalUnitCapital + totalUnrealised + Math.max(0, retainedEarnings);

  return (
    <div>
      <div className="card">
        <div className="card-head">
          <div>
            <div className="card-title">Balance Sheet — as on {fmtDate(todayISO())}</div>
            <div className="card-sub">Aggregated AMC + Schemes view</div>
          </div>
        </div>
        <div className="card-body">
          <div className="grid-2">
            <div>
              <h4 style={{margin:'0 0 8px',color:'var(--brand)',fontSize:13,letterSpacing:.5,textTransform:'uppercase'}}>Assets</h4>
              <table className="tbl">
                <tbody>
                  <tr style={{background:'#f4f6f9'}}><td colSpan="2"><b>Scheme Investments (MV)</b></td></tr>
                  {ASSET_CLASSES.filter(a=>assetMV[a.key]).map(a => (
                    <tr key={a.key}><td>&nbsp;&nbsp;{a.label}</td><td className="num">{fmtINR(assetMV[a.key])}</td></tr>
                  ))}
                  <tr><td><b>Total Investments</b></td><td className="num"><b>{fmtINR(totalAUM)}</b></td></tr>
                  <tr><td colSpan="2"><b>AMC Working Capital</b></td></tr>
                  <tr><td>&nbsp;&nbsp;Cash & Bank (net retained)</td><td className="num">{fmtINR(Math.max(0,cashOnHand))}</td></tr>
                  <tr style={{background:'var(--brand-soft)'}}>
                    <td><b>TOTAL ASSETS</b></td>
                    <td className="num"><b>{fmtINR(totalAssets)}</b></td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div>
              <h4 style={{margin:'0 0 8px',color:'var(--brand)',fontSize:13,letterSpacing:.5,textTransform:'uppercase'}}>Liabilities & Equity</h4>
              <table className="tbl">
                <tbody>
                  <tr style={{background:'#f4f6f9'}}><td colSpan="2"><b>Investor Unit Capital</b></td></tr>
                  {schemeData.map(sd => (
                    <tr key={sd.s.id}>
                      <td>&nbsp;&nbsp;{sd.s.code} ({fmtNum(sd.unitsIssued,3)} units)</td>
                      <td className="num">{fmtINR(sd.contribution)}</td>
                    </tr>
                  ))}
                  <tr><td><b>Total Unit Capital</b></td><td className="num"><b>{fmtINR(totalUnitCapital)}</b></td></tr>
                  <tr><td><b>Unrealised Gains / (Losses)</b></td>
                    <td className={'num '+(totalUnrealised>=0?'pos':'neg')}><b>{fmtINR(totalUnrealised)}</b></td></tr>
                  <tr><td><b>AMC Retained Earnings</b></td>
                    <td className={'num '+(retainedEarnings>=0?'pos':'neg')}><b>{fmtINR(retainedEarnings)}</b></td></tr>
                  <tr style={{background:'var(--brand-soft)'}}>
                    <td><b>TOTAL LIABILITIES & EQUITY</b></td>
                    <td className="num"><b>{fmtINR(totalLiabEquity + Math.max(0,cashOnHand) - retainedEarnings)}</b></td>
                  </tr>
                </tbody>
              </table>
              <div className="small" style={{marginTop:8,color:'var(--text-muted)'}}>
                Note: Simplified single-entity view. In a regulated AMC structure, scheme assets sit with a Trust, not the AMC's own balance sheet. AMC P&L (fees less expenses) accrues separately.
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ========================================================
   MIS DASHBOARD
   ======================================================== */
function MIS({ctx}){
  const { store } = ctx;
  const schemeData = store.schemes.map(s => ({s, ...computeSchemeAUM(s,store)}));

  // Investor concentration
  const investorAUM = store.investors.map(inv => {
    let total = 0;
    store.schemes.forEach(s => {
      const h = getInvestorHolding(inv.id, s.id, store);
      const sd = computeSchemeAUM(s,store);
      total += h.units * sd.nav;
    });
    return {inv, total};
  }).filter(x=>x.total>0).sort((a,b)=>b.total-a.total);

  const top5AUM = investorAUM.slice(0,5).reduce((a,b)=>a+b.total,0);
  const grandAUM = investorAUM.reduce((a,b)=>a+b.total,0);
  const top5Concentration = grandAUM>0 ? (top5AUM/grandAUM*100) : 0;

  // KYC status
  const kycCounts = store.investors.reduce((a,i)=>{
    const s = i.kycStatus||'Pending'; a[s]=(a[s]||0)+1; return a;
  },{});

  // Asset class across all schemes
  const assetMV = {};
  schemeData.forEach(sd => Object.entries(sd.breakdown).forEach(([k,v])=>assetMV[k]=(assetMV[k]||0)+v));
  const totalMV = Object.values(assetMV).reduce((a,b)=>a+b,0);

  // Monthly transaction trend
  const monthly = {};
  store.transactions.forEach(t => {
    const m = (t.date||'').slice(0,7);
    if(!monthly[m]) monthly[m]={inflow:0, outflow:0, count:0};
    monthly[m].count++;
    if(t.type==='SUBSCRIPTION'||t.type==='ADDITIONAL') monthly[m].inflow += Number(t.amount||0);
    if(t.type==='REDEMPTION') monthly[m].outflow += Number(t.amount||0);
  });
  const sortedMonths = Object.keys(monthly).sort();

  return (
    <div>
      <div className="kpi-grid">
        <div className="kpi">
          <div className="kpi-label">Total Investors</div>
          <div className="kpi-value">{store.investors.length}</div>
          <div className="kpi-delta">{kycCounts['Verified']||0} verified · {kycCounts['Pending']||0} pending</div>
        </div>
        <div className="kpi info">
          <div className="kpi-label">Active Schemes</div>
          <div className="kpi-value">{store.schemes.filter(s=>s.status==='Active').length}</div>
          <div className="kpi-delta">of {store.schemes.length} total</div>
        </div>
        <div className="kpi accent">
          <div className="kpi-label">Top-5 Concentration</div>
          <div className="kpi-value">{top5Concentration.toFixed(1)}%</div>
          <div className="kpi-delta">Top 5 investors share of AUM</div>
        </div>
        <div className="kpi warn">
          <div className="kpi-label">Total Transactions</div>
          <div className="kpi-value">{store.transactions.length}</div>
          <div className="kpi-delta">across {sortedMonths.length} month(s)</div>
        </div>
      </div>

      <div className="grid-2">
        <div className="card">
          <div className="card-head"><div className="card-title">Top Investors by Current Value</div></div>
          <div className="tbl-wrap">
            <table className="tbl">
              <thead><tr><th>#</th><th>Investor</th><th className="num">Current Value</th><th className="num">% of AUM</th></tr></thead>
              <tbody>
                {investorAUM.length===0 && <tr><td colSpan="4"><div className="empty">No investors yet</div></td></tr>}
                {investorAUM.slice(0,15).map((x,idx)=>(
                  <tr key={x.inv.id}>
                    <td>{idx+1}</td>
                    <td><b>{x.inv.name}</b><div className="small">{x.inv.folioNo}</div></td>
                    <td className="num">{fmtINR(x.total)}</td>
                    <td className="num">{grandAUM>0?(x.total/grandAUM*100).toFixed(2):0}%</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>

        <div className="card">
          <div className="card-head"><div className="card-title">Asset Class Distribution</div></div>
          <div className="card-body">
            {Object.keys(assetMV).length===0 ?
              <div className="empty">No holdings</div> :
              <table className="tbl">
                <thead><tr><th>Class</th><th className="num">MV</th><th className="num">%</th></tr></thead>
                <tbody>
                  {ASSET_CLASSES.filter(a=>assetMV[a.key]).map(a=>{
                    const v = assetMV[a.key];
                    const pct = totalMV>0?(v/totalMV*100):0;
                    return (
                      <tr key={a.key}>
                        <td>{a.label} <span className="small">({a.currency})</span></td>
                        <td className="num">{fmtINR(v)}</td>
                        <td className="num">{pct.toFixed(1)}%</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>}
          </div>
        </div>
      </div>

      <div className="card">
        <div className="card-head"><div className="card-title">Monthly Transaction Flow</div></div>
        <div className="tbl-wrap">
          <table className="tbl">
            <thead><tr><th>Month</th><th className="num">Inflow (Subs)</th><th className="num">Outflow (Redem)</th><th className="num">Net</th><th className="num">Count</th></tr></thead>
            <tbody>
              {sortedMonths.length===0 && <tr><td colSpan="5"><div className="empty">No transactions</div></td></tr>}
              {sortedMonths.map(m=>{
                const x = monthly[m];
                const net = x.inflow - x.outflow;
                return (
                  <tr key={m}>
                    <td><b>{m}</b></td>
                    <td className="num pos">{fmtINR(x.inflow)}</td>
                    <td className="num neg">{fmtINR(x.outflow)}</td>
                    <td className={'num '+(net>=0?'pos':'neg')}>{fmtINR(net)}</td>
                    <td className="num">{x.count}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>

      <div className="card">
        <div className="card-head"><div className="card-title">Scheme Performance Snapshot</div></div>
        <div className="tbl-wrap">
          <table className="tbl">
            <thead><tr>
              <th>Scheme</th><th>Status</th>
              <th className="num">AUM</th><th className="num">Cost</th>
              <th className="num">Unrealised P&L</th><th className="num">Return %</th>
              <th className="num">Investors</th>
            </tr></thead>
            <tbody>
              {schemeData.length===0 && <tr><td colSpan="7"><div className="empty">No schemes</div></td></tr>}
              {schemeData.map(sd => {
                const pl = sd.aum - sd.contribution;
                const ret = sd.contribution>0? (pl/sd.contribution*100):0;
                const invCount = new Set(store.transactions.filter(t=>t.schemeId===sd.s.id).map(t=>t.investorId)).size;
                return (
                  <tr key={sd.s.id}>
                    <td><b>{sd.s.code}</b><div className="small">{sd.s.name}</div></td>
                    <td><span className="pill pill-grey">{sd.s.status}</span></td>
                    <td className="num">{fmtINR(sd.aum)}</td>
                    <td className="num">{fmtINR(sd.contribution)}</td>
                    <td className={'num '+(pl>=0?'pos':'neg')}>{fmtINR(pl)}</td>
                    <td className={'num '+(ret>=0?'pos':'neg')}>{ret.toFixed(2)}%</td>
                    <td className="num">{invCount}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

/* ========================================================
   DATA MANAGEMENT
   ======================================================== */
function DataManagement({ctx}){
  const { store, setStore } = ctx;
  const [importing, setImporting] = useState(false);

  function exportJSON(){
    const data = JSON.stringify(store,null,2);
    const blob = new Blob([data],{type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `myeebank-backup-${todayISO()}.json`;
    a.click();
  }

  function exportCSV(rows, filename){
    if(!rows || rows.length===0){ alert('No data to export'); return; }
    const headers = Object.keys(rows[0]);
    const csv = [
      headers.join(','),
      ...rows.map(r => headers.map(h => {
        let v = r[h];
        if(v===null||v===undefined) v='';
        v = String(v).replace(/"/g,'""');
        if(/[",\n]/.test(v)) v = `"${v}"`;
        return v;
      }).join(','))
    ].join('\n');
    const blob = new Blob([csv],{type:'text/csv'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
  }

  function exportInvestorsCSV(){
    const rows = store.investors.map(i => ({
      FolioNo:i.folioNo, Name:i.name, PAN:i.pan, Aadhar:i.aadhar,
      DOB:i.dob, Mobile:i.mobile, Email:i.email,
      Address:i.address, City:i.city, State:i.state, Pincode:i.pincode,
      BankName:i.bankName, AccountNo:i.bankAccountNo, IFSC:i.bankIFSC, Branch:i.bankBranch, AccountType:i.accountType,
      Nominee:i.nomineeName, NomineeRelation:i.nomineeRelation, NomineePAN:i.nomineePan,
      Occupation:i.occupation, IncomeBracket:i.incomeBracket, RiskProfile:i.riskProfile,
      KYCStatus:i.kycStatus, CreatedAt:i.createdAt
    }));
    exportCSV(rows, `investors-${todayISO()}.csv`);
  }

  function exportTxnsCSV(){
    const rows = store.transactions.map(t => {
      const inv = store.investors.find(i=>i.id===t.investorId);
      const sch = store.schemes.find(s=>s.id===t.schemeId);
      return {
        Date:t.date, Folio:inv?.folioNo, Investor:inv?.name,
        SchemeCode:sch?.code, SchemeName:sch?.name,
        Type:t.type, Amount:t.amount, NAV:t.nav, Units:t.units,
        Mode:t.mode, Reference:t.reference, Remarks:t.remarks
      };
    });
    exportCSV(rows, `transactions-${todayISO()}.csv`);
  }

  function exportHoldingsCSV(){
    const rows = store.holdings.map(h => {
      const sch = store.schemes.find(s=>s.id===h.schemeId);
      const fx = sch?.currentFxRate || store.amc.fxDefault;
      const {mv, ltp} = computeHoldingMarketValue(h, store.navPrices, fx);
      const cost = computeHoldingCost(h);
      return {
        Scheme:sch?.code, AssetClass:assetLabel(h.assetClass),
        Instrument:h.instrumentName, Symbol:h.symbol, ISIN:h.isin, Sector:h.sector,
        Quantity:h.quantity,
        AvgCost: h.assetClass==='EQ_US' ? h.avgCostUSD : h.avgCost,
        Currency: assetCurrency(h.assetClass),
        BuyFX: h.buyFxRate, CurrentFX: fx,
        LTP: ltp, Cost_INR: cost, MarketValue_INR: mv,
        PnL_INR: mv-cost, PnL_Pct: cost>0?((mv-cost)/cost*100).toFixed(2):0,
        PurchaseDate: h.purchaseDate, MaturityDate: h.maturityDate, InterestRate: h.interestRate
      };
    });
    exportCSV(rows, `holdings-${todayISO()}.csv`);
  }

  function exportNAVHistoryCSV(){
    const rows = store.navHistory.map(n => {
      const sch = store.schemes.find(s=>s.id===n.schemeId);
      return { Date:n.date, SchemeCode:sch?.code, SchemeName:sch?.name,
        NAV:n.nav, AUM:n.aum, Units:n.units };
    });
    exportCSV(rows, `nav-history-${todayISO()}.csv`);
  }

  function importJSON(e){
    const file = e.target.files[0]; if(!file) return;
    if(!confirm('Importing will replace ALL current data. Continue?')) { e.target.value=''; return; }
    setImporting(true);
    const r = new FileReader();
    r.onload = ev => {
      try{
        const data = JSON.parse(ev.target.result);
        if(!data.investors || !data.schemes){ alert('Invalid file format'); setImporting(false); return; }
        setStore(data);
        alert('✓ Backup restored successfully.');
      }catch(err){ alert('Invalid JSON file: '+err.message); }
      setImporting(false);
      e.target.value='';
    };
    r.readAsText(file);
  }

  function loadSample(){
    if(!confirm('Load sample data? This will REPLACE all existing data.')) return;
    setStore(generateSample());
    alert('Sample data loaded.');
  }

  function resetAll(){
    if(!confirm('⚠ Reset ALL data? This cannot be undone.')) return;
    if(!confirm('Are you really sure? All investors, schemes, holdings, transactions will be deleted.')) return;
    setStore(JSON.parse(JSON.stringify(initialStore)));
    alert('All data reset.');
  }

  const counts = {
    investors: store.investors.length,
    schemes: store.schemes.length,
    holdings: store.holdings.length,
    transactions: store.transactions.length,
    navHistory: store.navHistory.length,
    income: store.income.length,
    expenses: store.expenses.length,
  };

  return (
    <div>
      <div className="card">
        <div className="card-head">
          <div>
            <div className="card-title">Full Backup & Restore (JSON)</div>
            <div className="card-sub">Complete data snapshot — use for archival or moving to another browser</div>
          </div>
        </div>
        <div className="card-body">
          <div className="row">
            <button className="btn btn-primary" onClick={exportJSON}>⇩ Download Full Backup (.json)</button>
            <label className="btn" style={{cursor:'pointer'}}>
              ⇧ Restore from Backup
              <input type="file" accept="application/json" onChange={importJSON} style={{display:'none'}}/>
            </label>
            {importing && <span className="small">Importing…</span>}
          </div>
          <div className="small" style={{marginTop:10,color:'var(--text-muted)'}}>
            Tip: Schedule a weekly download — keep one local copy and one in Drive.
          </div>
        </div>
      </div>

      <div className="card">
        <div className="card-head">
          <div>
            <div className="card-title">CSV Exports — Per Module</div>
            <div className="card-sub">Open in Excel for ad-hoc analysis, share with auditor or CA</div>
          </div>
        </div>
        <div className="card-body">
          <table className="tbl">
            <thead><tr><th>Module</th><th className="num">Records</th><th>Action</th></tr></thead>
            <tbody>
              <tr><td><b>Investors</b><div className="small">KYC + bank + nominee</div></td>
                <td className="num">{counts.investors}</td>

/* ========================================================
   GOOGLE DRIVE SYNC
   ======================================================== */
function DriveSync({ctx}){
  const { store, update, setStore } = ctx;
  const [status, setStatus] = useState('idle'); // idle, loading, signed_in, error
  const [tokenInfo, setTokenInfo] = useState(null);
  const [files, setFiles] = useState([]);
  const [busy, setBusy] = useState(false);
  const [log, setLog] = useState([]);
  const [clientId, setClientId] = useState(store.drive.clientId||'');
  const [folderName, setFolderName] = useState(store.drive.folderName||'MyeeBank-AMC');
  const [autoSync, setAutoSync] = useState(store.drive.autoSync||false);

  function addLog(msg, type='info'){
    setLog(l => [{ts:new Date().toLocaleTimeString(), msg, type},...l].slice(0,20));
  }

  // Load GIS (Google Identity Services)
  useEffect(()=>{
    if(document.getElementById('gis-script')) return;
    const s = document.createElement('script');
    s.id = 'gis-script';
    s.src = 'https://accounts.google.com/gsi/client';
    s.async = true; s.defer = true;
    document.body.appendChild(s);
  },[]);

  function saveConfig(){
    update({drive: {...store.drive, clientId, folderName, autoSync}});
    addLog('Configuration saved','success');
  }

  function signIn(){
    if(!clientId){ alert('Enter Google OAuth Client ID first'); return; }
    if(!window.google || !window.google.accounts){ alert('Google library still loading. Try again in a moment.'); return; }
    setBusy(true);
    const client = window.google.accounts.oauth2.initTokenClient({
      client_id: clientId,
      scope: 'https://www.googleapis.com/auth/drive.file',
      callback: (resp) => {
        if(resp.error){ addLog('Auth error: '+resp.error,'error'); setStatus('error'); setBusy(false); return; }
        setTokenInfo({access_token: resp.access_token, expires_at: Date.now()+(resp.expires_in*1000)});
        setStatus('signed_in');
        addLog('✓ Signed in to Google Drive','success');
        setBusy(false);
        ensureFolder(resp.access_token);
      }
    });
    client.requestAccessToken();
  }

  function signOut(){
    if(tokenInfo?.access_token && window.google){
      window.google.accounts.oauth2.revoke(tokenInfo.access_token, ()=>{});
    }
    setTokenInfo(null);
    setStatus('idle');
    setFiles([]);
    addLog('Signed out','info');
  }

  async function ensureFolder(token){
    try {
      // Search for folder
      const q = encodeURIComponent(`name='${folderName}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
      const r = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`, {
        headers: {Authorization: 'Bearer '+token}
      });
      const data = await r.json();
      let folderId = data.files?.[0]?.id;
      if(!folderId){
        // Create
        const cr = await fetch('https://www.googleapis.com/drive/v3/files',{
          method:'POST',
          headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
          body: JSON.stringify({name:folderName, mimeType:'application/vnd.google-apps.folder'})
        });
        const cd = await cr.json();
        folderId = cd.id;
        addLog('✓ Created folder: '+folderName,'success');
      } else {
        addLog('✓ Folder found: '+folderName,'info');
      }
      update({drive:{...store.drive, folderId, folderName, clientId, autoSync}});
      listFiles(token, folderId);
    } catch(e){
      addLog('Folder error: '+e.message,'error');
    }
  }

  async function listFiles(token, folderId){
    try {
      const fid = folderId || store.drive.folderId;
      if(!fid) return;
      const q = encodeURIComponent(`'${fid}' in parents and trashed=false`);
      const r = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,modifiedTime,size)&orderBy=modifiedTime desc`,{
        headers: {Authorization: 'Bearer '+token}
      });
      const data = await r.json();
      setFiles(data.files||[]);
    } catch(e){
      addLog('List error: '+e.message,'error');
    }
  }

  async function uploadBackup(){
    if(!tokenInfo){ alert('Sign in first'); return; }
    if(!store.drive.folderId){ alert('No folder set'); return; }
    setBusy(true);
    try{
      const content = JSON.stringify(store,null,2);
      const filename = `myeebank-backup-${new Date().toISOString().replace(/[:.]/g,'-')}.json`;
      const metadata = {name:filename, parents:[store.drive.folderId], mimeType:'application/json'};
      const boundary = '-------'+Math.random().toString(36).slice(2);
      const body =
        `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(metadata)}\r\n` +
        `--${boundary}\r\nContent-Type: application/json\r\n\r\n${content}\r\n--${boundary}--`;
      const r = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{
        method:'POST',
        headers:{Authorization:'Bearer '+tokenInfo.access_token,'Content-Type':`multipart/related; boundary=${boundary}`},
        body
      });
      const data = await r.json();
      if(data.error){ throw new Error(data.error.message); }
      update({drive:{...store.drive, lastSync: new Date().toISOString(), lastSyncFile: filename}});
      addLog('✓ Uploaded: '+filename,'success');
      listFiles(tokenInfo.access_token);
    }catch(e){
      addLog('Upload failed: '+e.message,'error');
    }
    setBusy(false);
  }

  async function downloadBackup(fileId, fileName){
    if(!tokenInfo){ alert('Sign in first'); return; }
    if(!confirm(`Restore from "${fileName}"? This will REPLACE all current data.`)) return;
    setBusy(true);
    try {
      const r = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`,{
        headers:{Authorization:'Bearer '+tokenInfo.access_token}
      });
      const text = await r.text();
      const data = JSON.parse(text);
      setStore(data);
      addLog('✓ Restored: '+fileName,'success');
      alert('Backup restored.');
    }catch(e){
      addLog('Restore failed: '+e.message,'error');
    }
    setBusy(false);
  }

  async function deleteFile(fileId, fileName){
    if(!confirm(`Delete "${fileName}" from Google Drive?`)) return;
    try{
      await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}`,{
        method:'DELETE', headers:{Authorization:'Bearer '+tokenInfo.access_token}
      });
      addLog('✓ Deleted: '+fileName,'info');
      listFiles(tokenInfo.access_token);
    }catch(e){
      addLog('Delete failed: '+e.message,'error');
    }
  }

  // Auto-sync — every 5 min when signed in
  useEffect(()=>{
    if(!autoSync || !tokenInfo) return;
    const t = setInterval(()=>{
      uploadBackup();
    }, 5*60*1000);
    return ()=>clearInterval(t);
  },[autoSync, tokenInfo]);

  return (
    <div>
      <div className="card">
        <div className="card-head">
          <div>
            <div className="card-title">Google Drive Configuration</div>
            <div className="card-sub">One-time setup: create OAuth Client ID in Google Cloud Console</div>
          </div>
          <span className={'pill '+(status==='signed_in'?'pill-green':status==='error'?'pill-red':'pill-grey')}>
            {status==='signed_in'?'✓ Connected':status==='error'?'⚠ Error':'Not connected'}
          </span>
        </div>
        <div className="card-body">
          <div className="form-grid">
            <div className="field full"><label>OAuth Client ID</label>
              <input value={clientId} onChange={e=>setClientId(e.target.value)}
                placeholder="xxxxxxxxx.apps.googleusercontent.com" style={{fontFamily:'monospace'}}/>
              <div className="small">
                Get from <span className="mono">console.cloud.google.com</span> → Create OAuth 2.0 Client ID (Web Application) → Add this page's URL to "Authorized JavaScript origins" → Enable Google Drive API.
              </div>
            </div>
            <div className="field"><label>Drive Folder Name</label>
              <input value={folderName} onChange={e=>setFolderName(e.target.value)}/></div>
            <div className="field"><label>Auto-Sync (every 5 min)</label>
              <select value={autoSync?'on':'off'} onChange={e=>setAutoSync(e.target.value==='on')}>
                <option value="off">Off — manual sync only</option>
                <option value="on">On — auto-upload</option>
              </select></div>
          </div>
          <div className="row" style={{marginTop:12}}>
            <button className="btn" onClick={saveConfig}>Save Configuration</button>
            {status!=='signed_in' ?
              <button className="btn btn-primary" onClick={signIn} disabled={busy||!clientId}>
                {busy?'Connecting…':'Sign in with Google'}
              </button> :
              <button className="btn btn-danger" onClick={signOut}>Sign Out</button>
            }
          </div>
        </div>
      </div>

      {status==='signed_in' && (
        <div className="card">
          <div className="card-head">
            <div>
              <div className="card-title">Sync Operations</div>
              <div className="card-sub">
                Folder: <b>{store.drive.folderName}</b>
                {store.drive.lastSync && <> · Last sync: <b>{new Date(store.drive.lastSync).toLocaleString()}</b></>}
              </div>
            </div>
            <div className="row">
              <button className="btn btn-primary" onClick={uploadBackup} disabled={busy}>
                {busy?'Working…':'☁ Backup Now to Drive'}
              </button>
              <button className="btn" onClick={()=>listFiles(tokenInfo.access_token)}>Refresh File List</button>
            </div>
          </div>
          <div className="tbl-wrap">
            <table className="tbl">
              <thead><tr>
                <th>Filename</th><th>Modified</th><th className="num">Size</th><th>Actions</th>
              </tr></thead>
              <tbody>
                {files.length===0 && <tr><td colSpan="4"><div className="empty">No backups in this folder yet</div></td></tr>}
                {files.map(f => (
                  <tr key={f.id}>
                    <td className="mono small">{f.name}</td>
                    <td>{new Date(f.modifiedTime).toLocaleString()}</td>
                    <td className="num">{f.size?Math.round(f.size/1024)+' KB':'—'}</td>
                    <td>
                      <button className="btn btn-sm btn-primary" onClick={()=>downloadBackup(f.id,f.name)}>↻ Restore</button>
                      {' '}
                      <button className="btn btn-sm btn-danger" onClick={()=>deleteFile(f.id,f.name)}>×</button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      <div className="card">
        <div className="card-head"><div className="card-title">Activity Log</div></div>
        <div className="card-body">
          {log.length===0 ? <div className="empty">No activity yet</div> :
            <div style={{fontSize:11.5,fontFamily:'monospace',maxHeight:200,overflowY:'auto'}}>
              {log.map((l,i)=>(
                <div key={i} style={{padding:'3px 0',color:l.type==='error'?'var(--negative)':l.type==='success'?'var(--positive)':'var(--text-muted)'}}>
                  <span className="small">[{l.ts}]</span> {l.msg}
                </div>
              ))}
            </div>}
        </div>
      </div>

      <div className="card">
        <div className="card-head"><div className="card-title">Setup Guide</div></div>
        <div className="card-body" style={{fontSize:12.5,lineHeight:1.7}}>
          <ol style={{paddingLeft:18,margin:0}}>
            <li>Open <span className="mono">console.cloud.google.com</span> and create (or select) a project.</li>
            <li>Navigate to <b>APIs & Services → Library</b>, search for <b>Google Drive API</b>, click Enable.</li>
            <li>Go to <b>APIs & Services → Credentials → Create Credentials → OAuth Client ID</b>.</li>
            <li>Application type: <b>Web application</b>. Add the URL where you serve this HTML (e.g. <span className="mono">https://yourname.github.io</span> or <span className="mono">http://localhost</span>) to <b>Authorized JavaScript origins</b>.</li>
            <li>Copy the Client ID, paste it above, save, and sign in.</li>
            <li>The app creates a dedicated folder in your Drive — all your AMC data stays there.</li>
            <li>Use <b>Auto-Sync</b> to push a fresh backup every 5 minutes automatically while the tab is open.</li>
          </ol>
        </div>
      </div>
    </div>
  );
}

function RptPortfolio({inv, store}){
  const rows = store.schemes.map(s => {
    const h = getInvestorHolding(inv.id, s.id, store);
    const latestNAV = getLatestNAV(s, store);
    const currentValue = h.units * latestNAV.nav;
    const avgCost = h.units>0 ? h.invested/h.units : 0;
    return {scheme:s, units:h.units, invested:h.invested, avgCost,
      latestNAV, currentValue, pnl: currentValue-h.invested,
      pnlPct: h.invested>0?((currentValue-h.invested)/h.invested*100):0};
  }).filter(r=>r.units>0);

  const totInv = rows.reduce((a,b)=>a+b.invested,0);
  const totCurr = rows.reduce((a,b)=>a+b.currentValue,0);

  if(rows.length===0) return <div className="empty">No holdings</div>;

  return (
    <div>
      <div className="tbl-wrap">
        <table className="tbl">
          <thead><tr>
            <th>Scheme</th>
            <th className="num">Units</th>
            <th className="num">Avg Cost</th>
            <th className="num">Latest NAV</th>
            <th>NAV Date</th>
            <th className="num">Invested</th>
            <th className="num">Current Value</th>
            <th className="num">Gain/Loss</th>
            <th className="num">Return %</th>
          </tr></thead>
          <tbody>
            {rows.map(r => (
              <tr key={r.scheme.id}>
                <td><b>{r.scheme.code}</b><div className="small">{r.scheme.name}</div></td>
                <td className="num">{fmtNum(r.units,3)}</td>
                <td className="num">{fmtNum(r.avgCost,4)}</td>
                <td className="num"><b>{fmtNum(r.latestNAV.nav,4)}</b></td>
                <td><span className="small">{r.latestNAV.source}<br/>{fmtDate(r.latestNAV.date)}</span></td>
                <td className="num">{fmtINR(r.invested)}</td>
                <td className="num">{fmtINR(r.currentValue)}</td>
                <td className={'num '+(r.pnl>=0?'pos':'neg')}>{fmtINR(r.pnl)}</td>
                <td className={'num '+(r.pnlPct>=0?'pos':'neg')}>{r.pnlPct.toFixed(2)}%</td>
              </tr>
            ))}
            <tr style={{background:'var(--brand-soft)',fontWeight:600}}>
              <td colSpan="5">TOTAL</td>
              <td className="num">{fmtINR(totInv)}</td>
              <td className="num">{fmtINR(totCurr)}</td>
              <td className={'num '+(totCurr>=totInv?'pos':'neg')}>{fmtINR(totCurr-totInv)}</td>
              <td className={'num '+(totCurr>=totInv?'pos':'neg')}>{totInv>0?((totCurr-totInv)/totInv*100).toFixed(2):0}%</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  );
}

function RptAllocation({inv, store}){
  // Look-through: investor's % stake in each scheme × scheme's asset allocation
  const buckets = {};
  let totalValue = 0;
  store.schemes.forEach(s => {
    const h = getInvestorHolding(inv.id, s.id, store);
    if(h.units<=0) return;
    const sd = computeSchemeAUM(s, store);
    if(sd.unitsIssued<=0 || sd.aum<=0) return;
    const sharePct = h.units / sd.unitsIssued;
    Object.entries(sd.breakdown).forEach(([k,v]) => {
      const allocVal = v * sharePct;
      buckets[k] = (buckets[k]||0) + allocVal;
      totalValue += allocVal;
    });
  });

  // Scheme-wise allocation too
  const schemeAlloc = store.schemes.map(s => {
    const h = getInvestorHolding(inv.id, s.id, store);
    if(h.units<=0) return null;
    const latestNAV = getLatestNAV(s, store);
    return {s, value: h.units*latestNAV.nav};
  }).filter(Boolean);
  const schemeTotal = schemeAlloc.reduce((a,b)=>a+b.value,0);

  if(Object.keys(buckets).length===0) return <div className="empty">No allocation to display</div>;

  return (
    <div>
      <div className="grid-2">
        <div>
          <h4 style={{margin:'0 0 8px',fontSize:12,textTransform:'uppercase',color:'var(--text-muted)',letterSpacing:.5}}>By Scheme</h4>
          {schemeAlloc.map(x => {
            const pct = schemeTotal>0?(x.value/schemeTotal*100):0;
            return (
              <div key={x.s.id} style={{marginBottom:10}}>
                <div style={{display:'flex',justifyContent:'space-between',fontSize:12.5,marginBottom:3}}>
                  <span><b>{x.s.code}</b></span>
                  <span>{fmtINR(x.value)} · {pct.toFixed(1)}%</span>
                </div>
                <div style={{height:6,background:'#eef1f6',borderRadius:3,overflow:'hidden'}}>
                  <div style={{height:'100%',width:pct+'%',background:'var(--brand)'}}/>
                </div>
              </div>
            );
          })}
        </div>
        <div>
          <h4 style={{margin:'0 0 8px',fontSize:12,textTransform:'uppercase',color:'var(--text-muted)',letterSpacing:.5}}>By Asset Class (Look-through)</h4>
          {ASSET_CLASSES.filter(a=>buckets[a.key]).map(a => {
            const v = buckets[a.key];
            const pct = totalValue>0?(v/totalValue*100):0;
            return (
              <div key={a.key} style={{marginBottom:10}}>
                <div style={{display:'flex',justifyContent:'space-between',fontSize:12.5,marginBottom:3}}>
                  <span><b>{a.label}</b></span>
                  <span>{fmtINR(v)} · {pct.toFixed(1)}%</span>
                </div>
                <div style={{height:6,background:'#eef1f6',borderRadius:3,overflow:'hidden'}}>
                  <div style={{height:'100%',width:pct+'%',background:'var(--accent)'}}/>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function RptCapitalGains({inv, store}){
  // FIFO computation of realised gains on redemptions
  const realised = [];
  let totalSTCG = 0, totalLTCG = 0;
  const LTCG_DAYS = 365; // 12 months threshold

  store.schemes.forEach(s => {
    const txns = store.transactions.filter(t=>t.investorId===inv.id && t.schemeId===s.id)
      .sort((a,b)=>new Date(a.date)-new Date(b.date));
    // FIFO lots
    const lots = []; // {date, units, cost}
    txns.forEach(t => {
      if(t.type==='SUBSCRIPTION'||t.type==='ADDITIONAL'){
        lots.push({date:t.date, units:Number(t.units||0), cost: Number(t.nav||0)});
      } else if(t.type==='REDEMPTION'){
        let remaining = Number(t.units||0);
        while(remaining>0 && lots.length>0){
          const lot = lots[0];
          const sellUnits = Math.min(remaining, lot.units);
          const costBasis = sellUnits * lot.cost;
          const proceeds = sellUnits * Number(t.nav||0);
          const gain = proceeds - costBasis;
          const days = (new Date(t.date) - new Date(lot.date))/(1000*60*60*24);
          const isLong = days >= LTCG_DAYS;
          realised.push({
            scheme:s, redemptionDate:t.date, acquisitionDate:lot.date,
            units:sellUnits, costPrice:lot.cost, salePrice:Number(t.nav||0),
            cost:costBasis, proceeds, gain, days:Math.floor(days),
            type: isLong?'LTCG':'STCG'
          });
          if(isLong) totalLTCG += gain; else totalSTCG += gain;
          lot.units -= sellUnits;
          remaining -= sellUnits;
          if(lot.units<=0.0001) lots.shift();
        }
      }
    });
  });

  // Unrealised gains
  const unrealised = [];
  let totalUnrealised = 0;
  store.schemes.forEach(s => {
    const h = getInvestorHolding(inv.id, s.id, store);
    if(h.units<=0) return;
    const latestNAV = getLatestNAV(s, store);
    const cv = h.units * latestNAV.nav;
    const gain = cv - h.invested;
    unrealised.push({scheme:s, units:h.units, cost:h.invested, currentValue:cv, gain});
    totalUnrealised += gain;
  });

  return (
    <div>
      <div className="kpi-grid">
        <div className="kpi"><div className="kpi-label">Realised STCG</div>
          <div className={'kpi-value '+(totalSTCG>=0?'pos':'neg')}>{fmtINR(totalSTCG)}</div>
          <div className="small">&lt; 12 months · Taxed at slab + applicable</div></div>
        <div className="kpi accent"><div className="kpi-label">Realised LTCG</div>
          <div className={'kpi-value '+(totalLTCG>=0?'pos':'neg')}>{fmtINR(totalLTCG)}</div>
          <div className="small">≥ 12 months · Taxed at LTCG rate</div></div>
        <div className="kpi info"><div className="kpi-label">Unrealised Gains</div>
          <div className={'kpi-value '+(totalUnrealised>=0?'pos':'neg')}>{fmtINR(totalUnrealised)}</div>
          <div className="small">On current holdings</div></div>
      </div>

      {realised.length>0 && (
        <div className="card">
          <div className="card-head"><div className="card-title">Realised Gains — FIFO</div></div>
          <div className="tbl-wrap">
            <table className="tbl">
              <thead><tr>
                <th>Scheme</th><th>Acquired</th><th>Redeemed</th>
                <th className="num">Days</th><th>Type</th>
                <th className="num">Units</th><th className="num">Cost NAV</th>
                <th className="num">Sale NAV</th><th className="num">Cost</th>
                <th className="num">Proceeds</th><th className="num">Gain/Loss</th>
              </tr></thead>
              <tbody>
                {realised.map((r,i)=>(
                  <tr key={i}>
                    <td><b>{r.scheme.code}</b></td>
                    <td>{fmtDate(r.acquisitionDate)}</td>
                    <td>{fmtDate(r.redemptionDate)}</td>
                    <td className="num">{r.days}</td>
                    <td><span className={'pill '+(r.type==='LTCG'?'pill-green':'pill-amber')}>{r.type}</span></td>
                    <td className="num">{fmtNum(r.units,3)}</td>
                    <td className="num">{fmtNum(r.costPrice,4)}</td>
                    <td className="num">{fmtNum(r.salePrice,4)}</td>
                    <td className="num">{fmtINR(r.cost)}</td>
                    <td className="num">{fmtINR(r.proceeds)}</td>
                    <td className={'num '+(r.gain>=0?'pos':'neg')}>{fmtINR(r.gain)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      <div className="card">
        <div className="card-head"><div className="card-title">Unrealised Gains — Current Holdings</div></div>
        {unrealised.length===0 ? <div className="empty">No active holdings</div> :
          <div className="tbl-wrap">
            <table className="tbl">
              <thead><tr>
                <th>Scheme</th><th className="num">Units</th>
                <th className="num">Cost</th><th className="num">Current Value</th>
                <th className="num">Unrealised Gain</th>
              </tr></thead>
              <tbody>
                {unrealised.map((u,i)=>(
                  <tr key={i}>
                    <td><b>{u.scheme.code}</b></td>
                    <td className="num">{fmtNum(u.units,3)}</td>
                    <td className="num">{fmtINR(u.cost)}</td>
                    <td className="num">{fmtINR(u.currentValue)}</td>
                    <td className={'num '+(u.gain>=0?'pos':'neg')}>{fmtINR(u.gain)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>}
      </div>

      <div className="card">
        <div className="card-body" style={{fontSize:11.5,color:'var(--text-muted)',lineHeight:1.6}}>
          <b>Notes:</b> Capital gains computed using FIFO lot-matching. LTCG threshold of 12 months is used here (applies to listed equity mutual funds in India). For debt funds and other instruments, the LTCG period and tax treatment may differ. This is for informational use — refer your tax advisor for ITR filing.
        </div>
      </div>
    </div>
  );
}

function RptPerformance({inv, store}){
  const rows = store.schemes.map(s => {
    const h = getInvestorHolding(inv.id, s.id, store);
    if(h.units<=0 && h.txns.length===0) return null;
    const latestNAV = getLatestNAV(s, store);
    const currentValue = h.units * latestNAV.nav;
    // First investment date
    const firstTxn = h.txns.find(t=>t.type==='SUBSCRIPTION'||t.type==='ADDITIONAL');
    const firstDate = firstTxn?.date;
    const days = firstDate ? Math.floor((new Date()-new Date(firstDate))/(1000*60*60*24)) : 0;
    const absReturn = h.invested>0 ? (currentValue-h.invested)/h.invested*100 : 0;
    const annReturn = (h.invested>0 && days>30) ?
      ((Math.pow(currentValue/h.invested, 365/days)-1)*100) : 0;
    return {scheme:s, h, latestNAV, currentValue, firstDate, days, absReturn, annReturn};
  }).filter(Boolean);

  if(rows.length===0) return <div className="empty">No performance data</div>;

  return (
    <div className="tbl-wrap">
      <table className="tbl">
        <thead><tr>
          <th>Scheme</th><th>First Investment</th><th className="num">Days Held</th>
          <th className="num">Invested</th><th className="num">Current Value</th>
          <th className="num">Absolute Return</th><th className="num">Annualised (XIRR-approx)</th>
        </tr></thead>
        <tbody>
          {rows.map(r=>(
            <tr key={r.scheme.id}>
              <td><b>{r.scheme.code}</b><div className="small">{r.scheme.name}</div></td>
              <td>{fmtDate(r.firstDate)}</td>
              <td className="num">{r.days}</td>
              <td className="num">{fmtINR(r.h.invested)}</td>
              <td className="num">{fmtINR(r.currentValue)}</td>
              <td className={'num '+(r.absReturn>=0?'pos':'neg')}>{r.absReturn.toFixed(2)}%</td>
              <td className={'num '+(r.annReturn>=0?'pos':'neg')}>{r.days>30?r.annReturn.toFixed(2)+'%':'—'}</td>
            </tr>
          ))}
        </tbody>
      </table>
      <div style={{padding:'10px 16px',fontSize:11.5,color:'var(--text-muted)'}}>
        Annualised return is a simple CAGR-style estimate based on first investment date and current value. For multiple-transaction XIRR, refer to portfolio statements separately.
      </div>
    </div>
  );
}

function RptLookThrough({inv, store}){
  // Show actual underlying instruments held proportionally
  const items = [];
  store.schemes.forEach(s => {
    const h = getInvestorHolding(inv.id, s.id, store);
    if(h.units<=0) return;
    const sd = computeSchemeAUM(s, store);
    if(sd.unitsIssued<=0) return;
    const sharePct = h.units / sd.unitsIssued;
    const fx = s.currentFxRate || store.amc.fxDefault;
    sd.holdings.forEach(hd => {
      const {mv} = computeHoldingMarketValue(hd, store.navPrices, fx);
      items.push({
        scheme: s, holding: hd, shareValue: mv*sharePct,
        sharePct: sharePct*100
      });
    });
  });

  if(items.length===0) return <div className="empty">No look-through positions</div>;

  const total = items.reduce((a,b)=>a+b.shareValue,0);
  // Sort by share value descending
  items.sort((a,b)=>b.shareValue-a.shareValue);

  return (
    <div>
      <div className="card-body" style={{padding:'0 0 10px',fontSize:11.5,color:'var(--text-muted)'}}>
        Your proportional ownership of each underlying instrument across all schemes — useful for understanding actual asset exposure.
      </div>
      <div className="tbl-wrap">
        <table className="tbl">
          <thead><tr>
            <th>Scheme</th><th>Asset</th><th>Instrument</th>
            <th className="num">Your Share %</th><th className="num">Effective Value</th>
            <th className="num">% of Your Portfolio</th>
          </tr></thead>
          <tbody>
            {items.map((it,i)=>(
              <tr key={i}>
                <td><b>{it.scheme.code}</b></td>
                <td><span className="pill pill-grey">{assetLabel(it.holding.assetClass)}</span></td>
                <td><b>{it.holding.instrumentName}</b><div className="small mono">{it.holding.symbol||''}</div></td>
                <td className="num">{it.sharePct.toFixed(3)}%</td>
                <td className="num">{fmtINR(it.shareValue)}</td>
                <td className="num">{total>0?(it.shareValue/total*100).toFixed(2):0}%</td>
              </tr>
            ))}
            <tr style={{background:'var(--brand-soft)',fontWeight:600}}>
              <td colSpan="4">TOTAL</td>
              <td className="num">{fmtINR(total)}</td>
              <td className="num">100.00%</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ========================================================
   SCHEME CASH LEDGER
   ======================================================== */
function CashLedger({ctx}){
  const { store, update } = ctx;
  const [filterScheme, setFilterScheme] = useState(store.schemes[0]?.id||'');
  const [showAdjust, setShowAdjust] = useState(false);

  if(store.schemes.length===0){
    return <div className="card"><div className="empty">No schemes yet</div></div>;
  }

  const scheme = store.schemes.find(s=>s.id===filterScheme) || store.schemes[0];
  const schemeData = computeSchemeAUM(scheme, store);

  // Build cash ledger entries
  const entries = [];
  store.transactions.filter(t=>t.schemeId===scheme.id).forEach(t => {
    const inv = store.investors.find(i=>i.id===t.investorId);
    if(t.type==='SUBSCRIPTION'||t.type==='ADDITIONAL'||t.type==='SWITCH_IN'){
      entries.push({date:t.date, type:'Subscription', desc:`${inv?.name||'?'} (${inv?.folioNo}) — ${t.type}`, debit:0, credit:Number(t.amount||0), ref:t.reference, sourceId:t.id, source:'TXN'});
    } else if(t.type==='REDEMPTION'||t.type==='SWITCH_OUT'){
      entries.push({date:t.date, type:'Redemption', desc:`${inv?.name||'?'} (${inv?.folioNo}) — ${t.type} ${t.payoutStatus==='PENDING'?'[PENDING — not yet paid]':''}`, debit:Number(t.amount||0), credit:0, ref:t.reference, sourceId:t.id, source:'TXN', pending:t.payoutStatus==='PENDING'});
    }
  });
  (store.portfolioTrades||[]).filter(t=>t.schemeId===scheme.id).forEach(t => {
    if(t.tradeType==='BUY'){
      entries.push({date:t.date, type:'Buy Asset', desc:`Bought ${fmtNum(t.quantity,3)} ${t.instrumentName} @ ${t.price}`, debit:Number(t.totalAmount||0), credit:0, ref:t.reference, sourceId:t.id, source:'TRADE'});
    } else if(t.tradeType==='SELL'){
      entries.push({date:t.date, type:'Sell Asset', desc:`Sold ${fmtNum(t.quantity,3)} ${t.instrumentName} @ ${t.price}`, debit:0, credit:Number(t.totalAmount||0), ref:t.reference, sourceId:t.id, source:'TRADE'});
    } else if(t.tradeType==='DIVIDEND'){
      entries.push({date:t.date, type:'Dividend', desc:`Dividend from ${t.instrumentName}`, debit:0, credit:Number(t.totalAmount||0), ref:t.reference, sourceId:t.id, source:'TRADE'});
    } else if(t.tradeType==='INTEREST'){
      entries.push({date:t.date, type:'Interest', desc:`Interest from ${t.instrumentName}`, debit:0, credit:Number(t.totalAmount||0), ref:t.reference, sourceId:t.id, source:'TRADE'});
    } else if(t.tradeType==='OTHER_INCOME'){
      entries.push({date:t.date, type:'Other Income', desc:t.notes||t.instrumentName, debit:0, credit:Number(t.totalAmount||0), ref:t.reference, sourceId:t.id, source:'TRADE'});
    } else if(t.tradeType==='SCHEME_EXPENSE'){
      entries.push({date:t.date, type:'Scheme Expense', desc:t.notes||t.instrumentName, debit:Number(t.totalAmount||0), credit:0, ref:t.reference, sourceId:t.id, source:'TRADE'});
    }
  });
  (store.cashFlows||[]).filter(c=>c.schemeId===scheme.id).forEach(c => {
    const amt = Number(c.amount||0);
    entries.push({date:c.date, type:'Manual Adjustment', desc:c.narration, debit:amt<0?Math.abs(amt):0, credit:amt>0?amt:0, ref:c.reference, sourceId:c.id, source:'CASHFLOW'});
  });

  entries.sort((a,b)=> new Date(a.date) - new Date(b.date));

  let runningBal = 0;
  const withBal = entries.map(e => {
    runningBal += (e.credit - e.debit);
    return {...e, balance: runningBal};
  });
  // Display newest first
  const display = withBal.slice().reverse();

  const totalCredit = entries.reduce((a,b)=>a+b.credit,0);
  const totalDebit = entries.reduce((a,b)=>a+b.debit,0);

  function deleteEntry(e){
    if(!confirm('Delete this entry? This will recalculate scheme cash and NAV.')) return;
    if(e.source==='TXN'){
      update(s => ({transactions: s.transactions.filter(x=>x.id!==e.sourceId)}));
    } else if(e.source==='TRADE'){
      update(s => ({portfolioTrades: s.portfolioTrades.filter(x=>x.id!==e.sourceId)}));
    } else if(e.source==='CASHFLOW'){
      update(s => ({cashFlows: s.cashFlows.filter(x=>x.id!==e.sourceId)}));
    }
  }

  return (
    <div>
      <div className="card">
        <div className="card-head">
          <div>
            <div className="card-title">Scheme Cash Ledger</div>
            <div className="card-sub">Every cash movement in the scheme's bank account</div>
          </div>
          <div className="row">
            <select value={filterScheme} onChange={e=>setFilterScheme(e.target.value)} style={{minWidth:280}}>
              {store.schemes.map(s=><option key={s.id} value={s.id}>{s.code} — {s.name}</option>)}
            </select>
            <button className="btn" onClick={()=>setShowAdjust(true)}>+ Manual Adjustment</button>
          </div>
        </div>
        <div className="card-body">
          <div className="kpi-grid">
            <div className="kpi"><div className="kpi-label">Cash Inflows</div>
              <div className="kpi-value pos">{fmtINR(totalCredit)}</div>
              <div className="small">Subscriptions + Sales + Income</div></div>
            <div className="kpi warn"><div className="kpi-label">Cash Outflows</div>
              <div className="kpi-value neg">{fmtINR(totalDebit)}</div>
              <div className="small">Redemptions + Purchases + Expenses</div></div>
            <div className="kpi accent"><div className="kpi-label">Current Cash Balance</div>
              <div className={'kpi-value '+(schemeData.schemeCash>=0?'pos':'neg')}>{fmtINR(schemeData.schemeCash)}</div>
              <div className="small">Available to pay redemptions / buy assets</div></div>
            <div className="kpi info"><div className="kpi-label">Total AUM (incl. cash)</div>
              <div className="kpi-value">{fmtINR(schemeData.aum)}</div>
              <div className="small">Cash + Investment MV</div></div>
          </div>
        </div>
      </div>

      <div className="card">
        <div className="card-head"><div className="card-title">Cash Movements — {scheme.code}</div></div>
        <div className="tbl-wrap">
          <table className="tbl">
            <thead><tr>
              <th>Date</th><th>Type</th><th>Description</th>
              <th className="num">Debit (Out)</th><th className="num">Credit (In)</th>
              <th className="num">Balance</th><th>Reference</th><th></th>
            </tr></thead>
            <tbody>
              {display.length===0 && <tr><td colSpan="8"><div className="empty">No cash movements yet</div></td></tr>}
              {display.map((e,i)=>(
                <tr key={i} style={e.pending?{background:'#fbf6e8'}:{}}>
                  <td>{fmtDate(e.date)}</td>
                  <td><span className={'pill '+(e.credit>0?'pill-green':'pill-amber')}>{e.type}</span></td>
                  <td>{e.desc}</td>
                  <td className={'num '+(e.debit>0?'neg':'')}>{e.debit>0?fmtINR(e.debit):'—'}</td>
                  <td className={'num '+(e.credit>0?'pos':'')}>{e.credit>0?fmtINR(e.credit):'—'}</td>
                  <td className="num"><b>{fmtINR(e.balance)}</b></td>
                  <td className="mono small">{e.ref||'—'}</td>
                  <td>{e.source==='CASHFLOW' && <button className="btn btn-sm btn-danger" onClick={()=>deleteEntry(e)}>×</button>}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      {showAdjust && <CashAdjustForm scheme={scheme} onSave={(rec)=>{
        update(s => ({cashFlows: [...(s.cashFlows||[]), {...rec, id:uid('CF'), schemeId:scheme.id}]}));
        setShowAdjust(false);
      }} onClose={()=>setShowAdjust(false)}/>}
    </div>
  );
}

function CashAdjustForm({scheme, onSave, onClose}){
  const [f, setF] = useState({date:todayISO(), amount:0, narration:'', reference:'', direction:'IN'});
  const set = (k,v) => setF(p=>({...p,[k]:v}));
  function submit(){
    if(!f.amount || !f.narration){alert('Amount & narration required'); return;}
    const signed = (f.direction==='IN'?1:-1) * Math.abs(Number(f.amount));
    onSave({...f, amount: signed});
  }
  return (
    <div className="modal-back" onClick={e=>{if(e.target===e.currentTarget)onClose()}}>
      <div className="modal sm">
        <div className="modal-head">
          <div className="modal-title">Manual Cash Adjustment — {scheme.code}</div>
          <button className="close-x" onClick={onClose}>×</button>
        </div>
        <div className="modal-body">
          <div className="form-grid">
            <div className="field"><label>Date</label>
              <input type="date" value={f.date} onChange={e=>set('date',e.target.value)}/></div>
            <div className="field"><label>Direction</label>
              <select value={f.direction} onChange={e=>set('direction',e.target.value)}>
                <option value="IN">Inflow (+)</option>
                <option value="OUT">Outflow (−)</option>
              </select></div>
            <div className="field full"><label>Amount (₹)</label>
              <input type="number" step="0.01" value={f.amount} onChange={e=>set('amount',e.target.value)}/></div>
            <div className="field full"><label>Narration</label>
              <input value={f.narration} onChange={e=>set('narration',e.target.value)}
                placeholder="e.g. Opening cash, Refund from bank, Correction entry"/></div>
            <div className="field full"><label>Reference</label>
              <input value={f.reference} onChange={e=>set('reference',e.target.value)}/></div>
          </div>
        </div>
        <div className="modal-foot">
          <button className="btn" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={submit}>Save</button>
        </div>
      </div>
    </div>
  );
}

/* ========================================================
   PORTFOLIO TRADES (Buy/Sell history)
   ======================================================== */
function PortfolioTrades({ctx}){
  const { store, update } = ctx;
  const [filterScheme, setFilterScheme] = useState('');
  const [filterType, setFilterType] = useState('');

  function remove(id){
    if(!confirm('Delete this trade? Cash balance will be recalculated. Note: this does NOT restore the holding quantity automatically — you may need to adjust the holding.')) return;
    update(s => ({portfolioTrades: (s.portfolioTrades||[]).filter(x=>x.id!==id)}));
  }

  const trades = (store.portfolioTrades||[]).filter(t => {
    if(filterScheme && t.schemeId!==filterScheme) return false;
    if(filterType && t.tradeType!==filterType) return false;
    return true;
  }).sort((a,b)=> new Date(b.date)-new Date(a.date));

  const totalBuys = trades.filter(t=>t.tradeType==='BUY').reduce((a,b)=>a+Number(b.totalAmount||0),0);
  const totalSells = trades.filter(t=>t.tradeType==='SELL').reduce((a,b)=>a+Number(b.totalAmount||0),0);
  const realisedGains = trades.filter(t=>t.tradeType==='SELL').reduce((a,b)=>a+Number(b.realisedGain||0),0);

  return (
    <div>
      <div className="kpi-grid">
        <div className="kpi"><div className="kpi-label">Total Purchases</div>
          <div className="kpi-value">{fmtINR(totalBuys)}</div>
          <div className="small">{trades.filter(t=>t.tradeType==='BUY').length} trades</div></div>
        <div className="kpi accent"><div className="kpi-label">Total Sales</div>
          <div className="kpi-value">{fmtINR(totalSells)}</div>
          <div className="small">{trades.filter(t=>t.tradeType==='SELL').length} trades</div></div>
        <div className="kpi info"><div className="kpi-label">Realised Gains</div>
          <div className={'kpi-value '+(realisedGains>=0?'pos':'neg')}>{fmtINR(realisedGains)}</div>
          <div className="small">From completed sales</div></div>
      </div>

      <div className="card">
        <div className="card-head">
          <div>
            <div className="card-title">All Portfolio Trades</div>
            <div className="card-sub">Buy/Sell history — use Holdings → Buy/Sell to create new trades</div>
          </div>
          <div className="row">

/* ========================================================
   PENDING REDEMPTION PAYOUTS
   ======================================================== */
function PendingPayouts({ctx}){
  const { store, update } = ctx;

  const pending = store.transactions
    .filter(t => (t.type==='REDEMPTION'||t.type==='SWITCH_OUT') && t.payoutStatus==='PENDING')
    .map(t => ({
      ...t,
      investor: store.investors.find(i=>i.id===t.investorId),
      scheme: store.schemes.find(s=>s.id===t.schemeId),
    }))
    .sort((a,b)=> new Date(a.date)-new Date(b.date));

  function markPaid(t){
    const scheme = store.schemes.find(s=>s.id===t.schemeId);
    const schemeData = computeSchemeAUM(scheme, store);
    if(schemeData.schemeCash < Number(t.amount||0)){
      if(!confirm(`⚠ Scheme cash (${fmtINR(schemeData.schemeCash)}) is still less than the payout amount (${fmtINR(t.amount)}).\n\nMark as paid anyway? This will make scheme cash go negative — please reconcile via Cash Ledger adjustment.`)) return;
    }
    update(s => ({transactions: s.transactions.map(x => x.id===t.id ? {...x, payoutStatus:'PAID', paidDate: todayISO()} : x)}));
  }

  function totalPending(){
    return pending.reduce((a,b)=>a+Number(b.amount||0),0);
  }

  // Group by scheme for cash gap analysis
  const bySchemeGap = {};
  pending.forEach(p => {
    if(!bySchemeGap[p.schemeId]) bySchemeGap[p.schemeId] = {scheme:p.scheme, pendingAmount:0};
    bySchemeGap[p.schemeId].pendingAmount += Number(p.amount||0);
  });
  Object.values(bySchemeGap).forEach(x => {
    x.cashAvailable = computeSchemeAUM(x.scheme, store).schemeCash;
    x.shortfall = Math.max(0, x.pendingAmount - x.cashAvailable);
  });

  return (
    <div>
      <div className="kpi-grid">
        <div className="kpi warn"><div className="kpi-label">Total Pending Payouts</div>
          <div className="kpi-value">{fmtINR(totalPending())}</div>
          <div className="small">{pending.length} unpaid redemption(s)</div></div>
      </div>

      {Object.keys(bySchemeGap).length>0 && (
        <div className="card">
          <div className="card-head"><div className="card-title">Cash Gap Analysis — per Scheme</div></div>
          <div className="tbl-wrap">
            <table className="tbl">
              <thead><tr>
                <th>Scheme</th><th className="num">Pending Payouts</th>
                <th className="num">Cash Available</th><th className="num">Shortfall</th>
                <th>Status</th>
              </tr></thead>
              <tbody>
                {Object.values(bySchemeGap).map(x=>(
                  <tr key={x.scheme.id}>
                    <td><b>{x.scheme.code}</b></td>
                    <td className="num">{fmtINR(x.pendingAmount)}</td>
                    <td className={'num '+(x.cashAvailable>=0?'pos':'neg')}>{fmtINR(x.cashAvailable)}</td>
                    <td className={'num '+(x.shortfall>0?'neg':'pos')}>{fmtINR(x.shortfall)}</td>
                    <td>{x.shortfall>0 ?
                      <span className="pill pill-red">SELL ASSETS NEEDED</span> :
                      <span className="pill pill-green">Cash Sufficient</span>
                    }</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      <div className="card">
        <div className="card-head"><div className="card-title">Pending Redemption Queue</div></div>
        <div className="tbl-wrap">
          <table className="tbl">
            <thead><tr>
              <th>Date</th><th>Investor</th><th>Scheme</th>
              <th className="num">Units</th><th className="num">NAV</th>
              <th className="num">Amount</th><th>Bank Details</th><th>Actions</th>
            </tr></thead>
            <tbody>
              {pending.length===0 && <tr><td colSpan="8"><div className="empty">No pending payouts ✓</div></td></tr>}
              {pending.map(t=>(
                <tr key={t.id}>
                  <td>{fmtDate(t.date)}</td>
                  <td><b>{t.investor?.name}</b><div className="small">{t.investor?.folioNo}</div></td>
                  <td><b>{t.scheme?.code}</b></td>
                  <td className="num">{fmtNum(t.units,3)}</td>
                  <td className="num">{fmtNum(t.nav,4)}</td>
                  <td className="num"><b>{fmtINR(t.amount)}</b></td>
                  <td className="small">
                    {t.investor?.bankName}<br/>
                    A/c: <span className="mono">{t.investor?.bankAccountNo}</span><br/>
                    IFSC: <span className="mono">{t.investor?.bankIFSC}</span>
                  </td>
                  <td>
                    <button className="btn btn-sm btn-primary" onClick={()=>markPaid(t)}>✓ Mark Paid</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      <div className="card">
        <div className="card-body" style={{fontSize:11.5,color:'var(--text-muted)',lineHeight:1.6}}>
          <b>How this works:</b><br/>
          1. When an investor redeems but the scheme doesn't have enough cash, the redemption is saved as <b>PENDING</b>. The investor's units are reduced immediately, but no cash flows out yet.<br/>
          2. The AMC sells portfolio assets (Holdings → Sell) to raise cash.<br/>
          3. Once cash is sufficient, mark the payout as <b>PAID</b> — the cash outflow is then recorded.<br/>
          4. Until paid, the redemption sits as a "liability" of the scheme — the cash hasn't physically left yet.
        </div>
      </div>
    </div>
  );
}
