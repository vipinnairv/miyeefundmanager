<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MyeeBank — AMC Manager</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root{
    --bg:#f6f8fb;
    --surface:#ffffff;
    --surface-2:#fbfcfe;
    --border:#e4e9f0;
    --border-strong:#cfd6e0;
    --text:#1a2233;
    --text-muted:#5a6577;
    --text-soft:#8390a3;
    --brand:#0b7a4b;        /* deep emerald — bank-grade */
    --brand-soft:#e6f4ed;
    --brand-strong:#085f3a;
    --accent:#c69b3f;       /* gold accent */
    --danger:#c0392b;
    --warning:#b07a1f;
    --info:#2a6fb3;
    --positive:#1e7a44;
    --negative:#b3321f;
    --shadow:0 1px 2px rgba(20,30,50,.04), 0 4px 12px rgba(20,30,50,.04);
    --shadow-lg:0 4px 12px rgba(20,30,50,.06), 0 16px 40px rgba(20,30,50,.08);
    --radius:10px;
    --radius-sm:6px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:'Inter','Helvetica Neue',Helvetica,Arial,sans-serif;
    font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
  button{font-family:inherit}
  input,select,textarea{font-family:inherit;font-size:13px}

  /* ---------- Layout ---------- */
  .app{display:flex;min-height:100vh}
  .sidebar{
    width:230px;background:#0e2233;color:#cfd9e6;padding:18px 0;flex-shrink:0;
    position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .brand{padding:0 20px 18px;border-bottom:1px solid #1c3247;margin-bottom:12px}
  .brand-mark{display:flex;align-items:center;gap:10px}
  .brand-logo{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#0b7a4b,#0f9c63);
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;
    box-shadow:0 0 0 1px rgba(255,255,255,.06)}
  .brand-name{font-size:15px;font-weight:600;color:#fff;letter-spacing:.2px}
  .brand-tag{font-size:10.5px;color:#7a8ca0;margin-top:2px;letter-spacing:.5px;text-transform:uppercase}

  .nav-group{padding:8px 0}
  .nav-label{font-size:10px;color:#5e7388;text-transform:uppercase;letter-spacing:1.2px;
    padding:8px 20px 6px;font-weight:600}
  .nav-item{display:flex;align-items:center;gap:10px;padding:8px 20px;cursor:pointer;
    color:#a8b6c8;font-size:13px;border-left:3px solid transparent;transition:all .15s}
  .nav-item:hover{background:#15293c;color:#fff}
  .nav-item.active{background:#15293c;color:#fff;border-left-color:var(--brand);font-weight:500}
  .nav-icon{width:16px;font-size:13px;opacity:.9}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{background:#fff;border-bottom:1px solid var(--border);padding:12px 24px;
    display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
  .page-title{font-size:18px;font-weight:600;color:var(--text);letter-spacing:-.2px}
  .page-sub{font-size:11.5px;color:var(--text-muted);margin-top:1px}
  .topbar-right{display:flex;align-items:center;gap:10px}
  .badge-env{font-size:10px;padding:3px 8px;background:var(--brand-soft);color:var(--brand-strong);
    border-radius:4px;font-weight:600;letter-spacing:.4px;text-transform:uppercase}

  .content{padding:22px 24px;max-width:100%}

  /* ---------- Cards ---------- */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);margin-bottom:16px}
  .card-head{padding:12px 16px;border-bottom:1px solid var(--border);
    display:flex;justify-content:space-between;align-items:center}
  .card-title{font-size:13px;font-weight:600;color:var(--text);letter-spacing:-.1px}
  .card-sub{font-size:11px;color:var(--text-muted);margin-top:1px}
  .card-body{padding:16px}
  .card-body.no-pad{padding:0}

  /* ---------- KPI ---------- */
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
  .kpi{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;
    box-shadow:var(--shadow);position:relative;overflow:hidden}
  .kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand)}
  .kpi.accent::before{background:var(--accent)}
  .kpi.info::before{background:var(--info)}
  .kpi.warn::before{background:var(--warning)}
  .kpi-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-muted);font-weight:600}
  .kpi-value{font-size:20px;font-weight:600;color:var(--text);margin-top:4px;letter-spacing:-.3px}
  .kpi-delta{font-size:11px;margin-top:3px;color:var(--text-muted)}
  .kpi-delta.pos{color:var(--positive);font-weight:500}
  .kpi-delta.neg{color:var(--negative);font-weight:500}

  /* ---------- Buttons ---------- */
  .btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:var(--radius-sm);
    border:1px solid var(--border-strong);background:#fff;color:var(--text);font-size:12.5px;
    cursor:pointer;font-weight:500;transition:all .12s;white-space:nowrap}
  .btn:hover{background:#f3f5f8;border-color:#b8c2cf}
  .btn-primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  .btn-primary:hover{background:var(--brand-strong);border-color:var(--brand-strong)}
  .btn-danger{background:#fff;color:var(--danger);border-color:#e6c0bb}
  .btn-danger:hover{background:#fbeceb}
  .btn-sm{padding:4px 9px;font-size:11.5px}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--text-muted)}
  .btn-ghost:hover{background:#eef1f6;color:var(--text)}

  /* ---------- Tables ---------- */
  .tbl{width:100%;border-collapse:collapse;font-size:12.5px}
  .tbl th{text-align:left;padding:9px 12px;background:#f4f6f9;color:var(--text-muted);
    font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px;
    border-bottom:1px solid var(--border);position:sticky;top:0}
  .tbl td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
  .tbl tr:hover td{background:#fafbfd}
  .tbl tr:last-child td{border-bottom:none}
  .tbl .num{text-align:right;font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  .tbl .center{text-align:center}
  .tbl-wrap{overflow-x:auto;max-width:100%}

  .pos{color:var(--positive);font-weight:500}
  .neg{color:var(--negative);font-weight:500}

  /* ---------- Forms ---------- */
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 14px}
  .form-grid.cols-2{grid-template-columns:repeat(2,1fr)}
  .form-grid.cols-3{grid-template-columns:repeat(3,1fr)}
  .field{display:flex;flex-direction:column;gap:4px}
  .field.full{grid-column:1/-1}
  label{font-size:11px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
  input[type=text],input[type=number],input[type=email],input[type=date],input[type=tel],select,textarea{
    border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:7px 10px;
    background:#fff;color:var(--text);outline:none;transition:border .12s}
  input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(11,122,75,.08)}
  textarea{resize:vertical;min-height:60px;font-family:inherit}

  /* ---------- Modal ---------- */
  .modal-back{position:fixed;inset:0;background:rgba(15,25,40,.55);display:flex;align-items:flex-start;
    justify-content:center;z-index:100;padding:40px 20px;overflow-y:auto}
  .modal{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow-lg);
    width:100%;max-width:760px;overflow:hidden;animation:slideUp .2s ease-out}
  .modal.lg{max-width:920px}
  .modal.sm{max-width:480px}
  @keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .modal-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;
    justify-content:space-between;align-items:center;background:var(--surface-2)}
  .modal-title{font-size:14px;font-weight:600}
  .modal-body{padding:18px;max-height:70vh;overflow-y:auto}
  .modal-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;
    justify-content:flex-end;gap:8px;background:var(--surface-2)}
  .close-x{background:transparent;border:none;font-size:18px;cursor:pointer;color:var(--text-muted);
    width:26px;height:26px;border-radius:4px;display:flex;align-items:center;justify-content:center}
  .close-x:hover{background:#eee;color:var(--text)}

  /* ---------- Pills/tags ---------- */
  .pill{display:inline-block;padding:2px 8px;border-radius:11px;font-size:10.5px;font-weight:600;
    letter-spacing:.3px;text-transform:uppercase}
  .pill-green{background:#e1f3e9;color:#1e7a44}
  .pill-blue{background:#e1eaf5;color:#2a6fb3}
  .pill-amber{background:#fbf0d8;color:#a17319}
  .pill-red{background:#fbe5e1;color:#a3331f}
  .pill-grey{background:#eaeef3;color:#5a6577}
  .pill-purple{background:#ebe4f4;color:#5e3aa8}

  /* ---------- Tabs ---------- */
  .tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:14px;
    overflow-x:auto;white-space:nowrap}
  .tab{padding:9px 16px;cursor:pointer;color:var(--text-muted);font-size:12.5px;font-weight:500;
    border-bottom:2px solid transparent;transition:all .12s}
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}

  /* ---------- Misc ---------- */
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .row.between{justify-content:space-between}
  .row.end{justify-content:flex-end}
  .spacer{flex:1}
  .hr{height:1px;background:var(--border);margin:14px 0}
  .empty{padding:36px 20px;text-align:center;color:var(--text-soft)}
  .empty-icon{font-size:32px;margin-bottom:8px;opacity:.45}
  .mono{font-family:'SF Mono','Monaco','Menlo','Consolas',monospace;font-size:12px}
  .small{font-size:11px;color:var(--text-muted)}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

  /* ---------- Statement print ---------- */
  .statement{background:#fff;padding:30px;max-width:780px;margin:0 auto;font-size:12px;color:#222}
  .statement-head{display:flex;justify-content:space-between;align-items:flex-start;
    border-bottom:2px solid var(--brand);padding-bottom:14px;margin-bottom:18px}
  .statement-brand{display:flex;align-items:center;gap:10px}
  .statement-logo{width:42px;height:42px;border-radius:8px;background:linear-gradient(135deg,#0b7a4b,#0f9c63);
    color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
  .stmt-tbl{width:100%;border-collapse:collapse;margin-top:8px;font-size:11.5px}
  .stmt-tbl th,.stmt-tbl td{border:1px solid #d8dee6;padding:6px 8px}
  .stmt-tbl th{background:#f0f4f7;text-align:left;font-weight:600}
  .stmt-tbl .num{text-align:right;font-variant-numeric:tabular-nums}
  .stmt-section{margin-top:14px}
  .stmt-section-title{font-weight:600;color:var(--brand);margin-bottom:6px;font-size:12.5px;
    text-transform:uppercase;letter-spacing:.5px}
  .stmt-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;font-size:11.5px}
  .stmt-meta-block{border:1px solid #e4e9f0;padding:8px 10px;border-radius:6px;background:#fbfcfe}
  .stmt-meta-block b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.4px;
    color:var(--text-muted);margin-bottom:2px}

  @media print{
    .sidebar,.topbar,.no-print{display:none !important}
    .main{margin:0}
    .content{padding:0}
    .card{box-shadow:none;border:none}
    body{background:#fff}
  }

  /* photo */
  .avatar{width:32px;height:32px;border-radius:50%;background:#dbe3ec;color:#5a6577;
    display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:11px;
    overflow:hidden;flex-shrink:0}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .avatar-lg{width:80px;height:80px;font-size:24px}

  /* segmented */
  .seg{display:inline-flex;background:#eef1f6;border-radius:6px;padding:2px;gap:2px}
  .seg-item{padding:5px 11px;font-size:11.5px;border-radius:4px;cursor:pointer;color:var(--text-muted);font-weight:500}
  .seg-item.active{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.06)}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useMemo, useRef } = React;

/* ========================================================
   STORAGE (localStorage — survives refresh)
   ======================================================== */
const STORE_KEY = 'myeebank_amc_v1';
const initialStore = {
  amc: {
    name: 'MyeeBank Asset Management',
    regNo: 'AMC/XX/2026/001',
    address: '—',
    pan: '—',
    gstin: '—',
    contact: '—',
    email: '—',
    fxDefault: 84.25, // INR per USD fallback
  },
  investors: [],
  schemes: [],
  holdings: [],     // scheme-level holdings (instruments owned by a scheme)
  transactions: [], // investor subscription/redemption transactions
  cashFlows: [],    // scheme-level cash ledger (auto + manual)
  portfolioTrades: [], // buy/sell of holdings (creates cash flows)
  payables: [],     // pending redemption payouts to investors
  navHistory: [],   // {schemeId, date, nav, aum}
  expenses: [],     // AMC operating expenses
  income: [],       // AMC management fees / income
  navPrices: {},    // {instrumentKey: ltp}
  drive: {
    clientId: '',
    folderId: '',
    folderName: 'MyeeBank-AMC',
    autoSync: false,
    lastSync: null,
    lastSyncFile: null,
  },
};

function loadStore(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      // Merge with initial to ensure new keys exist
      return {...initialStore, ...parsed, drive:{...initialStore.drive, ...(parsed.drive||{})}, amc:{...initialStore.amc, ...(parsed.amc||{})}};
    }
  }catch(e){ console.warn('Load failed:',e); }
  return JSON.parse(JSON.stringify(initialStore));
}
function saveStore(s){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }
  catch(e){ console.warn('Save failed:',e); }
}

/* ========================================================
   HELPERS
   ======================================================== */
const uid = (p='ID') => `${p}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,7)}`;
const fmtINR = (v, d=2) => {
  if(v===null||v===undefined||isNaN(v)) return '—';
  const n = Number(v);
  const neg = n<0;
  const abs = Math.abs(n);
  const parts = abs.toFixed(d).split('.');
  let x = parts[0];
  // Indian format
  const last3 = x.slice(-3);
  const rest = x.slice(0,-3);
  const formattedRest = rest.replace(/\B(?=(\d{2})+(?!\d))/g,',');
  const result = (rest? formattedRest+',' : '') + last3 + (parts[1]?'.'+parts[1]:'');
  return (neg?'-':'') + '₹' + result;
};
const fmtNum = (v, d=4) => {
  if(v===null||v===undefined||isNaN(v)) return '—';
  return Number(v).toLocaleString('en-IN',{minimumFractionDigits:d, maximumFractionDigits:d});
};
const fmtDate = (d) => {
  if(!d) return '—';
  const dt = new Date(d);
  return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
};
const todayISO = () => new Date().toISOString().slice(0,10);

const ASSET_CLASSES = [
  {key:'EQ_IN', label:'Indian Equity', currency:'INR'},
  {key:'EQ_US', label:'US Equity', currency:'USD'},
  {key:'MF', label:'Mutual Funds', currency:'INR'},
  {key:'BOND', label:'Bonds', currency:'INR'},
  {key:'FD', label:'Fixed Deposits', currency:'INR'},
  {key:'CASH', label:'Cash & Equivalent', currency:'INR'},
];

function assetLabel(k){ return (ASSET_CLASSES.find(a=>a.key===k)||{}).label || k }
function assetCurrency(k){ return (ASSET_CLASSES.find(a=>a.key===k)||{}).currency || 'INR' }

/* ========================================================
   APP ROOT
   ======================================================== */
function App(){
  const [store, setStore] = useState(loadStore);
  const [page, setPage] = useState('dashboard');
  useEffect(()=>{ saveStore(store) },[store]);

  const update = (patch) => setStore(s => ({...s, ...(typeof patch==='function'?patch(s):patch)}));

  const ctx = { store, setStore, update };

  const NAV = [
    { group:'Overview', items:[
      {id:'dashboard', label:'Dashboard', icon:'◈'},
      {id:'mis', label:'MIS / Analytics', icon:'▤'},
    ]},
    { group:'Investor Management', items:[
      {id:'investors', label:'Investors', icon:'◉'},
      {id:'transactions', label:'Subscriptions / Redemptions', icon:'⇄'},
      {id:'passbook', label:'Investor Passbook', icon:'☱'},
      {id:'statement', label:'Statement of Account', icon:'▭'},
      {id:'reports', label:'Investor Reports', icon:'◷'},
    ]},
    { group:'Fund Operations', items:[
      {id:'schemes', label:'Schemes (Closed-End Funds)', icon:'⬢'},
      {id:'holdings', label:'Scheme Holdings', icon:'⬚'},
      {id:'cashledger', label:'Scheme Cash Ledger', icon:'₹'},
      {id:'trades', label:'Portfolio Trades', icon:'⇋'},
      {id:'payouts', label:'Pending Payouts', icon:'⏳'},
      {id:'ltp', label:'LTP / Price Master', icon:'⟳'},
      {id:'nav', label:'NAV Computation', icon:'∑'},
    ]},
    { group:'AMC Financials', items:[
      {id:'pnl', label:'AMC P&L', icon:'⊞'},
      {id:'balsheet', label:'AMC Balance Sheet', icon:'▦'},
    ]},
    { group:'System', items:[
      {id:'data', label:'Data Management', icon:'⛁'},
      {id:'drive', label:'Google Drive Sync', icon:'☁'},
      {id:'settings', label:'AMC Settings', icon:'⚙'},
    ]},
  ];

  const pageMeta = {
    dashboard:{title:'AMC Dashboard', sub:'Real-time overview across all schemes & investors'},
    investors:{title:'Investor Master', sub:'KYC & contact registry'},
    transactions:{title:'Investor Transactions', sub:'Subscriptions, additional units & redemptions'},
    passbook:{title:'Investor Passbook', sub:'Unit-holding ledger per investor'},
    statement:{title:'Statement of Account', sub:'Printable investor statement'},
    reports:{title:'Investor Reports', sub:'Capital gains, allocation, performance — per investor'},
    schemes:{title:'Fund Schemes', sub:'Closed-end fund schemes managed by the AMC'},
    holdings:{title:'Scheme Portfolio Holdings', sub:'Underlying instruments held by each scheme'},
    cashledger:{title:'Scheme Cash Ledger', sub:'Auto-tracked cash flows per scheme — subscriptions, redemptions, trades'},
    trades:{title:'Portfolio Trades', sub:'Buy / Sell history of scheme holdings'},
    payouts:{title:'Pending Redemption Payouts', sub:'Investor redemptions awaiting cash payment'},
    ltp:{title:'LTP / Price Master', sub:'Last Traded Prices for valuation'},
    nav:{title:'NAV Computation', sub:'Net Asset Value calculation per scheme'},
    pnl:{title:'AMC Profit & Loss', sub:'Management fees, income, operating expenses'},
    balsheet:{title:'AMC Balance Sheet', sub:'Snapshot of AMC assets and liabilities'},
    mis:{title:'MIS Analytics', sub:'Cross-scheme management information'},
    data:{title:'Data Management', sub:'Export, Import, Backup, Restore'},
    drive:{title:'Google Drive Sync', sub:'Cloud backup to your Google Drive'},
    settings:{title:'AMC Settings', sub:'Branding & configuration'},
  };

  return (
    <div className="app">
      <aside className="sidebar">
        <div className="brand">
          <div className="brand-mark">
            <div className="brand-logo">M</div>
            <div>
              <div className="brand-name">MyeeBank</div>
              <div className="brand-tag">AMC Manager</div>
            </div>
          </div>
        </div>
        {NAV.map(g => (
          <div className="nav-group" key={g.group}>
            <div className="nav-label">{g.group}</div>
            {g.items.map(it => (
              <div key={it.id}
                className={'nav-item '+(page===it.id?'active':'')}
                onClick={()=>setPage(it.id)}>
                <span className="nav-icon">{it.icon}</span>
                <span>{it.label}</span>
              </div>
            ))}
          </div>
        ))}
      </aside>

      <div className="main">
        <header className="topbar">
          <div>
            <div className="page-title">{pageMeta[page]?.title}</div>
            <div className="page-sub">{pageMeta[page]?.sub}</div>
          </div>
          <div className="topbar-right">
            <span className="badge-env">Live</span>
            {store.drive.lastSync && (
              <span className="small" title={'Last Drive sync: '+new Date(store.drive.lastSync).toLocaleString()}>
                ☁ {new Date(store.drive.lastSync).toLocaleDateString('en-IN',{day:'2-digit',month:'short'})}
              </span>
            )}
            <button className="btn btn-sm" onClick={()=>{
              const data = JSON.stringify(store,null,2);
              const blob = new Blob([data],{type:'application/json'});
              const a = document.createElement('a');
              a.href = URL.createObjectURL(blob);
              a.download = `myeebank-backup-${todayISO()}.json`;
              a.click();
            }}>⇩ Backup</button>
            <label className="btn btn-sm" style={{cursor:'pointer'}}>
              ⇧ Restore
              <input type="file" accept="application/json" style={{display:'none'}}
                onChange={(e)=>{
                  const f = e.target.files[0]; if(!f) return;
                  if(!confirm('Restore will replace all current data. Continue?')) { e.target.value=''; return; }
                  const r = new FileReader();
                  r.onload = ev => {
                    try{
                      const data = JSON.parse(ev.target.result);
                      setStore(data);
                      alert('Backup restored.');
                    }catch(err){ alert('Invalid file'); }
                  };

/* ========================================================
   COMPUTATIONS
   ======================================================== */
function computeHoldingMarketValue(h, navPrices, fxRate){
  const key = h.instrumentKey;
  const ltp = navPrices[key] != null ? Number(navPrices[key]) : Number(h.lastPrice||0);
  let qty = Number(h.quantity||0);
  let mv;
  if(h.assetClass==='EQ_US'){
    // qty * ltp(USD) * fxRate
    mv = qty * ltp * Number(fxRate||0);
  } else if(h.assetClass==='CASH'){
    mv = Number(h.quantity||0); // qty represents INR cash directly
  } else if(h.assetClass==='FD'){
    // For FD: quantity = principal in INR, ltp can represent current value with accrued interest
    mv = ltp>0 ? ltp : qty;
  } else {
    mv = qty * ltp;
  }
  return { mv, ltp };
}

function computeHoldingCost(h){
  if(h.assetClass==='EQ_US'){
    return Number(h.quantity||0) * Number(h.avgCostUSD||0) * Number(h.buyFxRate||0);
  } else if(h.assetClass==='CASH'){
    return Number(h.quantity||0);
  } else if(h.assetClass==='FD'){
    return Number(h.quantity||0); // principal
  }
  return Number(h.quantity||0) * Number(h.avgCost||0);
}

function computeSchemeAUM(scheme, store){
  const fx = scheme.currentFxRate || store.amc.fxDefault;
  // Investment holdings (exclude CASH class — that's tracked separately now)
  const holdings = store.holdings.filter(h => h.schemeId===scheme.id);
  const investmentHoldings = holdings.filter(h => h.assetClass!=='CASH');
  const legacyCashHoldings = holdings.filter(h => h.assetClass==='CASH');

  let investmentMV = 0, investmentCost = 0;
  const breakdown = {};
  for(const h of investmentHoldings){
    const {mv} = computeHoldingMarketValue(h, store.navPrices, fx);
    const cost = computeHoldingCost(h);
    investmentMV += mv;
    investmentCost += cost;
    breakdown[h.assetClass] = (breakdown[h.assetClass]||0) + mv;
  }
  // Legacy manually-entered cash (treated as part of cash, not investment)
  let legacyCash = 0;
  for(const h of legacyCashHoldings){
    legacyCash += Number(h.quantity||0);
  }

  // Units issued
  const txns = store.transactions.filter(t => t.schemeId===scheme.id);
  let unitsIssued = 0, contribution = 0;
  for(const t of txns){
    if(t.type==='SUBSCRIPTION' || t.type==='ADDITIONAL'){
      unitsIssued += Number(t.units||0);
      contribution += Number(t.amount||0);
    } else if(t.type==='REDEMPTION'){
      unitsIssued -= Number(t.units||0);
      contribution -= Number(t.amount||0);
    }
  }

  // CRITICAL: Auto-tracked scheme cash from transactions + trades
  const autoCash = computeSchemeCash(scheme.id, store);
  const schemeCash = autoCash + legacyCash;
  breakdown['CASH'] = schemeCash;

  // Total AUM = Investment holdings + Scheme cash
  const aum = investmentMV + schemeCash;
  const nav = unitsIssued>0 ? aum/unitsIssued : Number(scheme.faceValue||10);
  return {
    aum, investmentMV, schemeCash, autoCash, legacyCash,
    totalCost: investmentCost,
    unitsIssued, contribution, nav, breakdown, holdings: investmentHoldings
  };
}

/* Auto-computed scheme cash balance ledger.
   Returns the net cash held by the scheme based on all events. */
function computeSchemeCash(schemeId, store){
  let cash = 0;
  // 1. Subscriptions add cash, redemptions reduce cash
  store.transactions.filter(t=>t.schemeId===schemeId).forEach(t => {
    if(t.type==='SUBSCRIPTION'||t.type==='ADDITIONAL'||t.type==='SWITCH_IN'){
      cash += Number(t.amount||0);
    } else if(t.type==='REDEMPTION'||t.type==='SWITCH_OUT'){
      cash -= Number(t.amount||0);
    }
  });
  // 2. Portfolio trades — BUY consumes cash, SELL adds cash, DIVIDEND/INTEREST adds cash
  (store.portfolioTrades||[]).filter(t=>t.schemeId===schemeId).forEach(t => {
    if(t.tradeType==='BUY') cash -= Number(t.totalAmount||0);
    else if(t.tradeType==='SELL') cash += Number(t.totalAmount||0);
    else if(t.tradeType==='DIVIDEND'||t.tradeType==='INTEREST'||t.tradeType==='OTHER_INCOME')
      cash += Number(t.totalAmount||0);
    else if(t.tradeType==='SCHEME_EXPENSE') cash -= Number(t.totalAmount||0);
  });
  // 3. Manual cash flow adjustments
  (store.cashFlows||[]).filter(c=>c.schemeId===schemeId).forEach(c => {
    cash += Number(c.amount||0); // signed: positive=inflow, negative=outflow
  });
  return cash;
}

function getInvestorHolding(investorId, schemeId, store){
  const txns = store.transactions.filter(t=>t.investorId===investorId && t.schemeId===schemeId)
    .sort((a,b)=> new Date(a.date)-new Date(b.date));
  let units=0, invested=0;
  for(const t of txns){
    if(t.type==='SUBSCRIPTION'||t.type==='ADDITIONAL'){
      units += Number(t.units||0);
      invested += Number(t.amount||0);
    } else if(t.type==='REDEMPTION'){
      units -= Number(t.units||0);
      invested -= Number(t.amount||0);
    }
  }
  return { units, invested, txns };
}

/* Scheme capacity tracking — for fixed-corpus closed-end funds */
function computeSchemeCapacity(scheme, store, excludeTxnId=null){
  const targetSize = Number(scheme.targetSize||0);
  const faceValue = Number(scheme.faceValue||10);
  const targetUnits = faceValue>0 ? targetSize / faceValue : 0;

  const txns = store.transactions.filter(t => t.schemeId===scheme.id && t.id!==excludeTxnId);
  let subscribedAmount = 0;
  let subscribedUnits = 0;
  for(const t of txns){
    if(t.type==='SUBSCRIPTION' || t.type==='ADDITIONAL'){
      subscribedAmount += Number(t.amount||0);
      subscribedUnits += Number(t.units||0);
    } else if(t.type==='REDEMPTION'){
      subscribedAmount -= Number(t.amount||0);
      subscribedUnits -= Number(t.units||0);
    }
  }
  const availableAmount = Math.max(0, targetSize - subscribedAmount);
  const availableUnits = Math.max(0, targetUnits - subscribedUnits);
  const pctSubscribed = targetSize>0 ? (subscribedAmount/targetSize*100) : 0;
  return { targetSize, targetUnits, subscribedAmount, subscribedUnits, availableAmount, availableUnits, pctSubscribed, faceValue };
}

/* Get latest NAV — checks navHistory first, then computes live */
function getLatestNAV(scheme, store, asOfDate=null){
  // Check snapshot history first
  const history = store.navHistory
    .filter(n => n.schemeId===scheme.id && (!asOfDate || n.date<=asOfDate))
    .sort((a,b)=> new Date(b.date)-new Date(a.date));
  if(history.length>0){
    return { nav: Number(history[0].nav), date: history[0].date, source:'Snapshot' };
  }
  // Fall back to live computation
  const sd = computeSchemeAUM(scheme, store);
  return { nav: sd.nav, date: asOfDate || todayISO(), source:'Live' };
}

   ======================================================== */
function Investors({ctx}){
  const { store, update } = ctx;
  const [editing, setEditing] = useState(null);
  const [search, setSearch] = useState('');

  const filtered = store.investors.filter(i => {
    if(!search) return true;
    const q = search.toLowerCase();
    return (i.name||'').toLowerCase().includes(q) ||
      (i.pan||'').toLowerCase().includes(q) ||
      (i.folioNo||'').toLowerCase().includes(q) ||
      (i.mobile||'').toLowerCase().includes(q);
  });

  function save(form){
    if(form.id){
      update(s => ({investors: s.investors.map(i=>i.id===form.id?form:i)}));
    } else {
      const folioCount = store.investors.length+1;
      const newInv = {...form, id: uid('INV'), folioNo: form.folioNo || `MYE${String(folioCount).padStart(5,'0')}`, createdAt: new Date().toISOString()};
      update(s => ({investors: [...s.investors, newInv]}));
    }
    setEditing(null);
  }

  function remove(id){
    if(!confirm('Delete this investor? Their transactions will remain but become orphaned.')) return;
    update(s => ({investors: s.investors.filter(i=>i.id!==id)}));
  }

  return (
    <div>
      <div className="card">
        <div className="card-head">
          <div>
            <div className="card-title">Investor Registry — {store.investors.length} investor(s)</div>
            <div className="card-sub">Full KYC profile + bank details + photograph</div>
          </div>
          <div className="row">
            <input type="text" placeholder="Search by name / PAN / folio…" value={search}
              onChange={e=>setSearch(e.target.value)} style={{minWidth:240}}/>
            <button className="btn btn-primary" onClick={()=>setEditing({})}>+ New Investor</button>
          </div>
        </div>
        <div className="tbl-wrap">
          <table className="tbl">
            <thead><tr>
              <th>Folio</th><th>Investor</th><th>PAN</th><th>Mobile</th><th>City</th><th>KYC</th><th>Actions</th>
            </tr></thead>
            <tbody>
              {filtered.length===0 && <tr><td colSpan="7"><div className="empty">
                <div className="empty-icon">◉</div>No investors yet. Click "+ New Investor" to onboard.
              </div></td></tr>}
              {filtered.map(i => (
                <tr key={i.id}>
                  <td><span className="mono">{i.folioNo}</span></td>
                  <td>
                    <div className="row">
                      <div className="avatar">{i.photo? <img src={i.photo}/> : (i.name||'?')[0]}</div>
                      <div>
                        <b>{i.name}</b>
                        <div className="small">{i.email}</div>
                      </div>
                    </div>
                  </td>
                  <td><span className="mono">{i.pan||'—'}</span></td>
                  <td>{i.mobile||'—'}</td>
                  <td>{i.city||'—'}</td>
                  <td><span className={'pill '+(i.kycStatus==='Verified'?'pill-green':i.kycStatus==='Pending'?'pill-amber':'pill-grey')}>{i.kycStatus||'Pending'}</span></td>
                  <td>
                    <button className="btn btn-sm" onClick={()=>setEditing(i)}>Edit</button>
                    {' '}
                    <button className="btn btn-sm btn-danger" onClick={()=>remove(i.id)}>Delete</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      {editing!==null && <InvestorForm investor={editing} onSave={save} onClose={()=>setEditing(null)}/>}
    </div>
  );
}

/* ========================================================
   HOLDINGS (per scheme)
   ======================================================== */
function Holdings({ctx}){
  const { store, update } = ctx;
  const [editing, setEditing] = useState(null);
  const [trading, setTrading] = useState(null);  // {holding, mode:'SELL'|'BUY'}
  const [filterScheme, setFilterScheme] = useState('');
  const [filterAsset, setFilterAsset] = useState('');

  function save(h){
    // Register instrument in price master if not present
    const instKey = h.instrumentKey || makeInstKey(h);
    h.instrumentKey = instKey;
    if(h.id){
      update(s => ({holdings: s.holdings.map(x=>x.id===h.id?h:x)}));
    } else {
      update(s => ({holdings:[...s.holdings, {...h, id:uid('HLD')}]}));
    }
    // Seed LTP
    update(s => {
      if(s.navPrices[instKey] == null){
        return {navPrices: {...s.navPrices, [instKey]: Number(h.lastPrice||h.avgCost||0)}};
      }
      return {};
    });
    setEditing(null);
  }
  function remove(id){
    if(!confirm('Delete this holding?')) return;
    update(s => ({holdings: s.holdings.filter(x=>x.id!==id)}));
  }

  // Execute a SELL / BUY trade against a holding
  function executeTrade(trade){
    const holding = store.holdings.find(h => h.id===trade.holdingId);
    if(!holding){alert('Holding not found'); return;}

    const qty = Number(trade.quantity||0);
    const price = Number(trade.price||0);
    const totalAmount = trade.assetClass==='EQ_US'
      ? qty * price * Number(trade.fxRate||0)
      : qty * price;

    // Record the trade (creates cash flow)
    const tradeRec = {
      id: uid('TRD'),
      schemeId: holding.schemeId,
      holdingId: holding.id,
      instrumentKey: holding.instrumentKey,
      instrumentName: holding.instrumentName,
      symbol: holding.symbol,
      assetClass: holding.assetClass,
      date: trade.date,
      tradeType: trade.mode,  // BUY or SELL
      quantity: qty,
      price: price,
      fxRate: trade.fxRate || null,
      totalAmount: totalAmount,
      reference: trade.reference,
      notes: trade.notes,
      // For SELL, capture realised gain
      ...(trade.mode==='SELL' ? {
        avgCostAtSale: trade.assetClass==='EQ_US' ?
          (Number(holding.avgCostUSD||0) * Number(holding.buyFxRate||0)) :
          Number(holding.avgCost||0),
        realisedGain: trade.assetClass==='EQ_US' ?
          (qty * price * Number(trade.fxRate||0)) - (qty * Number(holding.avgCostUSD||0) * Number(holding.buyFxRate||0)) :
          (qty * price) - (qty * Number(holding.avgCost||0))
      } : {})
    };

    update(s => ({portfolioTrades: [...(s.portfolioTrades||[]), tradeRec]}));

    // Update the holding quantity
    let newQty = trade.mode==='BUY'
      ? Number(holding.quantity||0) + qty
      : Number(holding.quantity||0) - qty;
    if(newQty < 0.0001) newQty = 0;

    update(s => ({
      holdings: s.holdings.map(h => h.id===holding.id ?
        {...h, quantity: newQty, lastPrice: price, ...(trade.mode==='BUY'&&trade.assetClass!=='EQ_US' ? {
          // Re-average cost for BUY (simple weighted avg)
          avgCost: ((Number(h.quantity||0)*Number(h.avgCost||0)) + (qty*price)) / (Number(h.quantity||0)+qty)
        }:{}) } : h)
    }));

    // Update LTP price master with latest trade price
    update(s => ({
      navPrices: {...s.navPrices, [holding.instrumentKey]: price}
    }));

    setTrading(null);
    alert(`✓ ${trade.mode} executed.\n\n${qty} units of ${holding.instrumentName} @ ${price}\nTotal: ${fmtINR(totalAmount)}\n\nScheme Cash ${trade.mode==='SELL'?'INCREASED':'DECREASED'} by ${fmtINR(totalAmount)}.${trade.mode==='SELL'&&tradeRec.realisedGain ? '\n\nRealised P&L: '+fmtINR(tradeRec.realisedGain):''}`);
  }

  const filtered = store.holdings.filter(h => {
    if(filterScheme && h.schemeId!==filterScheme) return false;
    if(filterAsset && h.assetClass!==filterAsset) return false;
    return true;
  });

  return (
    <div>
      <div className="card">
        <div className="card-head">
          <div>
            <div className="card-title">Scheme Holdings — {store.holdings.length} position(s)</div>
            <div className="card-sub">Use Buy/Sell to raise or deploy scheme cash automatically</div>
          </div>
          <div className="row">
            <select value={filterScheme} onChange={e=>setFilterScheme(e.target.value)}>
              <option value="">All schemes</option>
              {store.schemes.map(s=> <option key={s.id} value={s.id}>{s.code}</option>)}
            </select>
            <select value={filterAsset} onChange={e=>setFilterAsset(e.target.value)}>
              <option value="">All asset classes</option>
              {ASSET_CLASSES.map(a => <option key={a.key} value={a.key}>{a.label}</option>)}
            </select>
            <button className="btn btn-primary" onClick={()=>setEditing({})} disabled={store.schemes.length===0}>+ Add Holding</button>
          </div>
        </div>
        <div className="tbl-wrap">
          <table className="tbl">
            <thead><tr>
              <th>Scheme</th><th>Asset</th><th>Instrument</th>
              <th className="num">Qty/Units</th><th className="num">Avg Cost</th>
              <th className="num">LTP</th><th className="num">FX (buy)</th>
              <th className="num">Cost (₹)</th><th className="num">MV (₹)</th>
              <th className="num">P&L %</th><th>Actions</th>
            </tr></thead>
            <tbody>
              {filtered.length===0 && <tr><td colSpan="11"><div className="empty">No holdings</div></td></tr>}
              {filtered.map(h => {
                const sch = store.schemes.find(s=>s.id===h.schemeId);
                const fx = sch?.currentFxRate || store.amc.fxDefault;
                const {mv, ltp} = computeHoldingMarketValue(h, store.navPrices, fx);
                const cost = computeHoldingCost(h);
                const pl = cost>0?((mv-cost)/cost*100):0;
                const canTrade = h.assetClass!=='CASH';
                return (
                  <tr key={h.id}>
                    <td><b>{sch?.code||'?'}</b></td>
                    <td><span className="pill pill-grey">{assetLabel(h.assetClass)}</span></td>
                    <td>
                      <b>{h.instrumentName}</b>
                      {h.symbol && <div className="small mono">{h.symbol}</div>}
                    </td>
                    <td className="num">{fmtNum(h.quantity, h.assetClass==='CASH'?2:3)}</td>
                    <td className="num">
                      {h.assetClass==='EQ_US' ? `$${fmtNum(h.avgCostUSD,2)}` :
                       h.assetClass==='CASH' ? '—' :
                       fmtNum(h.avgCost,2)}
                    </td>
                    <td className="num">
                      {h.assetClass==='EQ_US' ? `$${fmtNum(ltp,2)}` :
                       h.assetClass==='CASH' ? '—' :
                       fmtNum(ltp,2)}
                    </td>
                    <td className="num">{h.assetClass==='EQ_US' ? fmtNum(h.buyFxRate,2) : '—'}</td>
                    <td className="num">{fmtINR(cost)}</td>
                    <td className="num">{fmtINR(mv)}</td>
                    <td className={'num '+(pl>=0?'pos':'neg')}>{cost>0?pl.toFixed(2)+'%':'—'}</td>
                    <td>
                      {canTrade && <>
                        <button className="btn btn-sm" style={{background:'#e1f3e9',color:'#1e7a44',borderColor:'#bfe3cd'}}
                          onClick={()=>setTrading({holding:h, mode:'BUY'})}>Buy</button>
                        {' '}
                        <button className="btn btn-sm" style={{background:'#fbf0d8',color:'#a17319',borderColor:'#ecd9a3'}}
                          disabled={Number(h.quantity||0)<=0}
                          onClick={()=>setTrading({holding:h, mode:'SELL'})}>Sell</button>
                        {' '}
                      </>}
                      <button className="btn btn-sm" onClick={()=>setEditing(h)}>✎</button>
                      {' '}<button className="btn btn-sm btn-danger" onClick={()=>remove(h.id)}>×</button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
      {editing!==null && <HoldingForm holding={editing} store={store} onSave={save} onClose={()=>setEditing(null)}/>}
      {trading!==null && <TradeForm trade={trading} store={store} onExecute={executeTrade} onClose={()=>setTrading(null)}/>}
    </div>
  );
}

/* Trade form — execute BUY or SELL of an existing holding */
function TradeForm({trade, store, onExecute, onClose}){
  const holding = trade.holding;
  const mode = trade.mode;
  const sch = store.schemes.find(s=>s.id===holding.schemeId);
  const schemeData = computeSchemeAUM(sch, store);
  const fx = sch?.currentFxRate || store.amc.fxDefault;
  const currentLTP = store.navPrices[holding.instrumentKey] ?? holding.lastPrice ?? 0;

  const [f, setF] = useState({
    date: todayISO(),
    quantity: 0,
    price: currentLTP,
    fxRate: fx,
    reference: '',
    notes: '',
    mode,
    holdingId: holding.id,
    assetClass: holding.assetClass,
  });
  const set = (k,v) => setF(p=>({...p,[k]:v}));

  const isUS = holding.assetClass==='EQ_US';
  const totalAmount = isUS
    ? Number(f.quantity||0) * Number(f.price||0) * Number(f.fxRate||0)
    : Number(f.quantity||0) * Number(f.price||0);

  const maxQty = mode==='SELL' ? Number(holding.quantity||0) : 999999999;
  const insufficientCash = mode==='BUY' && totalAmount > schemeData.schemeCash + 0.01;
  const overSell = mode==='SELL' && Number(f.quantity||0) > maxQty + 0.0001;

  // Realised gain preview for SELL
  let realisedGain = 0;
  if(mode==='SELL' && Number(f.quantity||0)>0){
    if(isUS){
      const costINR = Number(f.quantity||0) * Number(holding.avgCostUSD||0) * Number(holding.buyFxRate||0);
      realisedGain = totalAmount - costINR;
    } else {
      realisedGain = (Number(f.price||0) - Number(holding.avgCost||0)) * Number(f.quantity||0);
    }
  }

  function fillMax(){
    if(mode==='SELL'){
      set('quantity', holding.quantity);
    } else {
      // Max buy = how much you can afford
      const maxAffordable = isUS
        ? schemeData.schemeCash / (Number(f.price||0) * Number(f.fxRate||0))
        : schemeData.schemeCash / Number(f.price||0);
      if(Number(f.price||0)>0){
        set('quantity', Math.floor(maxAffordable*1000)/1000);
      }
    }
  }

  function submit(){
    if(!f.quantity || Number(f.quantity)<=0){alert('Quantity required'); return;}
    if(!f.price || Number(f.price)<=0){alert('Price required'); return;}
    if(overSell){alert('Cannot sell more than held quantity'); return;}
    if(insufficientCash){
      if(!confirm(`⚠ Scheme cash insufficient.\n\nAvailable: ${fmtINR(schemeData.schemeCash)}\nNeeded: ${fmtINR(totalAmount)}\n\nProceed anyway? (Cash will go negative — please reconcile.)`)) return;
    }
    onExecute(f);
  }

  return (
    <div className="modal-back" onClick={e=>{if(e.target===e.currentTarget)onClose()}}>
      <div className="modal">
        <div className="modal-head">
          <div className="modal-title">
            {mode==='BUY' ? '🟢 BUY' : '🟡 SELL'} — {holding.instrumentName}
            {holding.symbol && <span className="small mono"> ({holding.symbol})</span>}
          </div>
          <button className="close-x" onClick={onClose}>×</button>
        </div>
        <div className="modal-body">
          <div style={{background:'#f4f7fb',padding:'10px 12px',borderRadius:6,marginBottom:14,fontSize:12}}>
            <b>Scheme: {sch?.code} — {sch?.name}</b>
            <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8,marginTop:6,fontSize:11.5}}>
              <div><span className="small">Asset Class</span><br/><b>{assetLabel(holding.assetClass)}</b></div>
              <div><span className="small">Current Holding</span><br/><b>{fmtNum(holding.quantity, 3)}</b></div>
              <div><span className="small">Avg Cost</span><br/>
                <b>{isUS ? `$${fmtNum(holding.avgCostUSD,2)}` : fmtNum(holding.avgCost,2)}</b>
              </div>
              <div><span className="small">Current LTP</span><br/><b>{fmtNum(currentLTP,2)}</b></div>
              <div><span className="small">Scheme Cash Available</span><br/>
                <b style={{color: schemeData.schemeCash>0?'var(--brand)':'var(--negative)'}}>{fmtINR(schemeData.schemeCash)}</b>
              </div>
              <div><span className="small">Mode</span><br/>
                <b style={{color:mode==='BUY'?'var(--positive)':'var(--warning)'}}>{mode}</b>
              </div>
            </div>
          </div>

          <div className="form-grid cols-2">
            <div className="field"><label>Trade Date</label>
              <input type="date" value={f.date} onChange={e=>set('date',e.target.value)}/></div>
            <div className="field"><label>Quantity {mode==='SELL'?`(max ${fmtNum(maxQty,3)})`:''}</label>
              <input type="number" step="0.0001" value={f.quantity} onChange={e=>set('quantity',e.target.value)}
                style={overSell?{borderColor:'var(--negative)',background:'#fbe9e6'}:{}}/>
              {overSell && <div className="small" style={{color:'var(--negative)'}}>Exceeds holding</div>}</div>
            <div className="field"><label>{isUS ? 'Price per Share (USD)' : 'Price per Unit (₹)'}</label>
              <input type="number" step="0.0001" value={f.price} onChange={e=>set('price',e.target.value)}/></div>
            {isUS && <div className="field"><label>FX Rate (INR/USD)</label>
              <input type="number" step="0.01" value={f.fxRate} onChange={e=>set('fxRate',e.target.value)}/></div>}
            <div className="field full"><label>Reference / Broker Note</label>
              <input value={f.reference} onChange={e=>set('reference',e.target.value)} placeholder="Broker contract note ID, UTR, etc."/></div>
            <div className="field full"><label>Notes</label>
              <textarea rows="2" value={f.notes} onChange={e=>set('notes',e.target.value)}/></div>
          </div>

          <div style={{background:'#fbfcfe',border:'1px solid var(--border)',padding:'10px 12px',borderRadius:6,marginTop:14,fontSize:12.5}}>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
              <span>Total Trade Value:</span>
              <b>{fmtINR(totalAmount)}</b>
            </div>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
              <span>Scheme Cash After Trade:</span>
              <b style={{color:(schemeData.schemeCash + (mode==='SELL'?totalAmount:-totalAmount))>=0 ? 'var(--positive)':'var(--negative)'}}>
                {fmtINR(schemeData.schemeCash + (mode==='SELL'?totalAmount:-totalAmount))}
              </b>
            </div>
            {mode==='SELL' && <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
              <span>Realised Gain / (Loss):</span>
              <b className={realisedGain>=0?'pos':'neg'}>{fmtINR(realisedGain)}</b>
            </div>}
            <div style={{display:'flex',justifyContent:'space-between'}}>
              <span>Remaining Holding:</span>
              <b>{fmtNum(mode==='SELL' ? Math.max(0, holding.quantity - Number(f.quantity||0)) : Number(holding.quantity||0) + Number(f.quantity||0), 3)}</b>
            </div>
            {insufficientCash && <div style={{marginTop:8,padding:'6px 10px',background:'#fbe9e6',color:'var(--negative)',borderRadius:4,fontSize:11.5}}>
              ⚠ Insufficient scheme cash for this purchase
            </div>}
          </div>

          <div className="row" style={{marginTop:10}}>
            <button className="btn btn-sm" onClick={fillMax}>
              {mode==='SELL'?'Sell All Held':'Max Buy (use full cash)'}
            </button>
          </div>
        </div>
        <div className="modal-foot">
          <button className="btn" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={submit} disabled={overSell}>
            Execute {mode}
          </button>
        </div>
      </div>
    </div>
  );
}

function makeInstKey(h){
  return `${h.assetClass}::${(h.symbol||h.instrumentName||'').toUpperCase().replace(/\s+/g,'_')}`;
}

function HoldingForm({holding, store, onSave, onClose}){
  const [f, setF] = useState({
    schemeId: store.schemes[0]?.id || '',
    assetClass:'EQ_IN',
    instrumentName:'', symbol:'',
    quantity:0, avgCost:0, lastPrice:0,
    avgCostUSD:0, buyFxRate: store.amc.fxDefault,
    purchaseDate: todayISO(),
    isin:'', sector:'',
    maturityDate:'', interestRate:0,
    notes:'',
    ...holding
  });
  const set = (k,v) => setF(p=>({...p,[k]:v}));

  const isBond = f.assetClass==='BOND';

  function submit(){
    if(!f.schemeId){alert('Select scheme'); return;}
    if(!f.instrumentName){alert('Instrument name required'); return;}
    onSave(f);
  }

  return (
    <div className="modal-back" onClick={e=>{if(e.target===e.currentTarget)onClose()}}>
      <div className="modal">
        <div className="modal-head">

        <div className="modal-body">

              <select value={f.schemeId} onChange={e=>set('schemeId',e.target.value)}>
                <option value="">-- Select --</option>
                {store.schemes.map(s=> <option key={s.id} value={s.id}>{s.code} — {s.name}</option>)}

            <div className="field"><label>Asset Class *</label>

              </select>
              {f.assetClass==='CASH' && <div className="small" style={{color:'var(--warning)'}}>⚠ Cash holdings are now auto-tracked from subscriptions/trades. Use Cash Ledger → Manual Adjustment instead.</div>}
              </div>
            <div className="field full"><label>Instrument Name *</label>
              <input value={f.instrumentName} onChange={e=>set('instrumentName',e.target.value)}
                placeholder={isCash?'e.g. HDFC Current Account':'e.g. Reliance Industries / AAPL / HDFC Top 100 / 7.26 GOI 2033'}/></div>
            {!isCash && <div className="field"><label>Symbol / Code</label>

            {(f.assetClass==='EQ_IN'||f.assetClass==='MF'||isBond) &&

            <div className="field"><label>Purchase Date</label>
              <input type="date" value={f.purchaseDate} onChange={e=>set('purchaseDate',e.target.value)}/></div>

            {!isCash && <div className="field"><label>{isFD?'Principal (₹)':'Quantity / Units'}</label>
              <input type="number" step="0.0001" value={f.quantity} onChange={e=>set('quantity',e.target.value)}/></div>}

            {isCash && <div className="field"><label>Amount (₹)</label>
              <input type="number" step="0.01" value={f.quantity} onChange={e=>set('quantity',e.target.value)}/></div>}

            {!isCash && !isUS && !isFD && <div className="field"><label>Avg Cost / Unit</label>
              <input type="number" step="0.0001" value={f.avgCost} onChange={e=>set('avgCost',e.target.value)}/></div>}
            {!isCash && !isUS && !isFD && <div className="field"><label>LTP / NAV</label>
              <input type="number" step="0.0001" value={f.lastPrice} onChange={e=>set('lastPrice',e.target.value)}/></div>}

            {isUS && <>
              <div className="field"><label>Avg Cost / Share (USD)</label>
                <input type="number" step="0.0001" value={f.avgCostUSD} onChange={e=>set('avgCostUSD',e.target.value)}/></div>

              </div>

            {isFD && <>
              <div className="field"><label>Maturity Date</label>
                <input type="date" value={f.maturityDate} onChange={e=>set('maturityDate',e.target.value)}/></div>
              <div className="field"><label>Interest Rate % p.a.</label>

/* ========================================================
   LTP / Price Master
   ======================================================== */
function LTPMaster({ctx}){
  const { store, update } = ctx;
  const [bulkFx, setBulkFx] = useState(store.amc.fxDefault);

  // Aggregate all instruments by instrumentKey
  const instruments = useMemo(()=>{
    const map = {};
    store.holdings.forEach(h => {
      const k = h.instrumentKey || makeInstKey(h);
      if(!map[k]){
        map[k] = {
          key:k, assetClass:h.assetClass, instrumentName:h.instrumentName,
          symbol:h.symbol, currency:assetCurrency(h.assetClass),
          schemes:new Set(),
        };
      }
      const sch = store.schemes.find(s=>s.id===h.schemeId);
      if(sch) map[k].schemes.add(sch.code);
    });
    return Object.values(map);
  },[store.holdings, store.schemes]);

  function setPrice(k,v){
    update(s => ({navPrices: {...s.navPrices, [k]: v===''?'':Number(v)}}));
  }

  function applyBulkFx(){
    if(!confirm('Apply this FX rate to all active schemes (overwrite statement-date FX)?')) return;
    update(s => ({
      schemes: s.schemes.map(sc => ({...sc, currentFxRate: Number(bulkFx)})),
      amc: {...s.amc, fxDefault: Number(bulkFx)}
    }));
    alert('Statement-date FX updated for all schemes.');
  }

  return (
    <div>
      <div className="card">
        <div className="card-head">
          <div>
            <div className="card-title">USD → INR Exchange Rate (Statement Date)</div>
            <div className="card-sub">Applied uniformly across all schemes for US Equity valuation</div>
          </div>
        </div>
        <div className="card-body">
          <div className="row">
            <div className="field" style={{minWidth:200}}>
              <label>Statement-Date FX (INR per USD)</label>
              <input type="number" step="0.01" value={bulkFx} onChange={e=>setBulkFx(e.target.value)}/>
            </div>
            <button className="btn btn-primary" onClick={applyBulkFx}>Apply to All Schemes</button>
            <div className="small">Each scheme also stores its own FX rate, editable in Schemes module.</div>
          </div>
        </div>
      </div>

      <div className="card">
        <div className="card-head">
          <div>
            <div className="card-title">Instrument Price Master — {instruments.length}</div>
            <div className="card-sub">Update LTP / NAV for each instrument; values flow into MV and NAV calculations</div>
          </div>
        </div>
        <div className="tbl-wrap">
          <table className="tbl">
            <thead><tr>
              <th>Asset</th><th>Instrument</th><th>Symbol</th>
              <th>In Schemes</th><th>Currency</th>
              <th className="num">Last Price / LTP</th>
            </tr></thead>
            <tbody>
              {instruments.length===0 && <tr><td colSpan="6"><div className="empty">No instruments yet</div></td></tr>}
              {instruments.map(it => (
                <tr key={it.key}>
                  <td><span className="pill pill-grey">{assetLabel(it.assetClass)}</span></td>
                  <td><b>{it.instrumentName}</b></td>
                  <td><span className="mono">{it.symbol||'—'}</span></td>
                  <td>{Array.from(it.schemes).map(c=><span key={c} className="pill pill-blue" style={{marginRight:3}}>{c}</span>)}</td>
                  <td>{it.currency}</td>
                  <td className="num">
                    <input type="number" step="0.0001" style={{width:120,textAlign:'right'}}
                      value={store.navPrices[it.key]??''}
                      onChange={e=>setPrice(it.key, e.target.value)}/>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

/* ========================================================
   NAV COMPUTATION
   ======================================================== */
function NAVComputation({ctx}){
  const { store, update } = ctx;
  const [navDate, setNavDate] = useState(todayISO());

  function snapshotAll(){
    if(!confirm(`Snapshot NAV for all schemes as on ${navDate}?`)) return;
    const newEntries = store.schemes.map(s => {
      const sd = computeSchemeAUM(s,store);
      return {id:uid('NAV'), schemeId:s.id, date:navDate, nav:sd.nav, aum:sd.aum, units:sd.unitsIssued};
    });
    update(s => ({navHistory: [...s.navHistory.filter(n=>n.date!==navDate), ...newEntries]}));
    alert(`NAV snapshot saved for ${store.schemes.length} scheme(s).`);
  }

  return (
    <div>
      <div className="card">
        <div className="card-head">
          <div>
            <div className="card-title">Live NAV — across all schemes</div>
            <div className="card-sub">NAV = Total Market Value of Holdings ÷ Units Outstanding</div>
          </div>
          <div className="row">
            <input type="date" value={navDate} onChange={e=>setNavDate(e.target.value)}/>
            <button className="btn btn-primary" onClick={snapshotAll}>📸 Snapshot NAV</button>
          </div>
        </div>
        <div className="tbl-wrap">
          <table className="tbl">
            <thead><tr>
              <th>Scheme</th>
              <th className="num">Investments MV</th>
              <th className="num">Scheme Cash</th>
              <th className="num">Total AUM</th>
              <th className="num">Units Issued</th>
              <th className="num">NAV/Unit</th>
              <th className="num">Face Value</th>
              <th className="num">Return %</th>
            </tr></thead>
            <tbody>
              {store.schemes.length===0 && <tr><td colSpan="8"><div className="empty">No schemes</div></td></tr>}
              {store.schemes.map(s => {
                const sd = computeSchemeAUM(s,store);
                const ret = s.faceValue>0 ? ((sd.nav-s.faceValue)/s.faceValue*100) : 0;
                return (
                  <tr key={s.id}>
                    <td><b>{s.code}</b><div className="small">{s.name}</div></td>
                    <td className="num">{fmtINR(sd.investmentMV)}</td>
                    <td className={'num '+(sd.schemeCash<0?'neg':'')}>{fmtINR(sd.schemeCash)}</td>
                    <td className="num"><b>{fmtINR(sd.aum)}</b></td>
                    <td className="num">{fmtNum(sd.unitsIssued,3)}</td>
                    <td className="num"><b>{fmtNum(sd.nav,4)}</b></td>
                    <td className="num">{fmtNum(s.faceValue,2)}</td>
                    <td className={'num '+(ret>=0?'pos':'neg')}>{ret.toFixed(2)}%</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>

      <div className="card">
        <div className="card-head">
          <div>
            <div className="card-title">NAV History</div>
            <div className="card-sub">Daily snapshots</div>
          </div>
        </div>
        <div className="tbl-wrap">
          <table className="tbl">
            <thead><tr>
              <th>Date</th><th>Scheme</th><th className="num">NAV</th>
              <th className="num">AUM</th><th className="num">Units</th><th></th>
            </tr></thead>
            <tbody>
              {store.navHistory.length===0 && <tr><td colSpan="6"><div className="empty">No snapshots</div></td></tr>}
              {store.navHistory.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).map(n => {
                const sch = store.schemes.find(s=>s.id===n.schemeId);
                return (
                  <tr key={n.id}>
                    <td>{fmtDate(n.date)}</td>
                    <td><b>{sch?.code||'?'}</b></td>
                    <td className="num">{fmtNum(n.nav,4)}</td>
                    <td className="num">{fmtINR(n.aum)}</td>
                    <td className="num">{fmtNum(n.units,3)}</td>
                    <td>
                      <button className="btn btn-sm btn-danger" onClick={()=>{
                        if(confirm('Delete snapshot?'))
                          update(s=>({navHistory: s.navHistory.filter(x=>x.id!==n.id)}));

/* ========================================================
   TRANSACTIONS (subscriptions / redemptions)
   ======================================================== */
function Transactions({ctx}){
  const { store, update } = ctx;
  const [editing, setEditing] = useState(null);
  const [filterInv, setFilterInv] = useState('');
  const [filterSch, setFilterSch] = useState('');

  function save(t){
    if(t.id) update(s => ({transactions: s.transactions.map(x=>x.id===t.id?t:x)}));
    else update(s => ({transactions:[...s.transactions, {...t, id:uid('TXN')}]}));
    setEditing(null);
  }
  function remove(id){
    if(!confirm('Delete this transaction?')) return;
    update(s => ({transactions: s.transactions.filter(x=>x.id!==id)}));
  }

  const filtered = store.transactions.filter(t => {
    if(filterInv && t.investorId!==filterInv) return false;
    if(filterSch && t.schemeId!==filterSch) return false;
    return true;
  }).sort((a,b)=>new Date(b.date)-new Date(a.date));

  return (
    <div>
      <div className="card">
        <div className="card-head">
          <div>
            <div className="card-title">Investor Transactions — {filtered.length}</div>
            <div className="card-sub">Subscription = initial; Additional = top-up; Redemption = pay-out</div>
          </div>
          <div className="row">
            <select value={filterInv} onChange={e=>setFilterInv(e.target.value)}>
              <option value="">All investors</option>
              {store.investors.map(i=><option key={i.id} value={i.id}>{i.folioNo} — {i.name}</option>)}
            </select>
            <select value={filterSch} onChange={e=>setFilterSch(e.target.value)}>
              <option value="">All schemes</option>
              {store.schemes.map(s=><option key={s.id} value={s.id}>{s.code}</option>)}
            </select>
            <button className="btn btn-primary"
              disabled={store.investors.length===0||store.schemes.length===0}
              onClick={()=>setEditing({})}>+ New Transaction</button>
          </div>
        </div>
        <div className="tbl-wrap">
          <table className="tbl">
            <thead><tr>
              <th>Date</th><th>Investor</th><th>Scheme</th><th>Type</th>
              <th className="num">Amount</th><th className="num">NAV</th><th className="num">Units</th>
              <th>Mode</th><th>Reference</th><th></th>
            </tr></thead>
            <tbody>
              {filtered.length===0 && <tr><td colSpan="10"><div className="empty">No transactions</div></td></tr>}
              {filtered.map(t => {
                const inv = store.investors.find(i=>i.id===t.investorId);
                const sch = store.schemes.find(s=>s.id===t.schemeId);
                return (
                  <tr key={t.id}>
                    <td>{fmtDate(t.date)}</td>
                    <td><b>{inv?.name||'?'}</b><div className="small">{inv?.folioNo}</div></td>
                    <td><b>{sch?.code||'?'}</b></td>
                    <td><span className={'pill '+(
                      t.type==='SUBSCRIPTION'?'pill-green':
                      t.type==='ADDITIONAL'?'pill-blue':
                      t.type==='REDEMPTION'?'pill-amber':'pill-grey'
                    )}>{t.type}</span></td>
                    <td className="num">{fmtINR(t.amount)}</td>
                    <td className="num">{fmtNum(t.nav,4)}</td>
                    <td className="num">{fmtNum(t.units,3)}</td>
                    <td>{t.mode||'—'}</td>
                    <td><span className="mono small">{t.reference||'—'}</span></td>
                    <td>
                      <button className="btn btn-sm" onClick={()=>setEditing(t)}>Edit</button>
                      {' '}<button className="btn btn-sm btn-danger" onClick={()=>remove(t.id)}>×</button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
      {editing!==null && <TxnForm txn={editing} store={store} onSave={save} onClose={()=>setEditing(null)}/>}
    </div>
  );
}

function TxnForm({txn, store, onSave, onClose}){
  const [f, setF] = useState({
    date: todayISO(),
    investorId: store.investors[0]?.id||'',
    schemeId: store.schemes[0]?.id||'',
    type:'SUBSCRIPTION',
    amount:0, nav:0, units:0,
    mode:'NEFT', reference:'', remarks:'',
    ...txn
  });
  const set = (k,v) => setF(p=>({...p,[k]:v}));

  // Capacity for selected scheme (excluding self if editing)
  const selScheme = store.schemes.find(s=>s.id===f.schemeId);
  const capacity = selScheme ? computeSchemeCapacity(selScheme, store, f.id||null) : null;
  const schemeData = selScheme ? computeSchemeAUM(selScheme, store) : null;

  // Investor's holding for redemption checks
  const invHolding = (f.investorId && f.schemeId) ? getInvestorHolding(f.investorId, f.schemeId, store) : null;
  const investorAvailableUnits = invHolding ? invHolding.units : 0;

  // Auto-suggest NAV from current scheme
  useEffect(()=>{
    if(f.schemeId && (!f.nav || f.nav===0)){
      const sch = store.schemes.find(s=>s.id===f.schemeId);
      if(sch){
        if(f.type==='SUBSCRIPTION' && (!f.id)){
          set('nav', sch.faceValue);
        } else {
          const latest = getLatestNAV(sch, store);
          set('nav', latest.nav);
        }
      }
    }
  },[f.schemeId, f.type]);

  // Auto-calculate units from amount/NAV
  useEffect(()=>{
    if(f.amount>0 && f.nav>0){
      const u = Number(f.amount)/Number(f.nav);
      set('units', Math.round(u*10000)/10000);
    }
  },[f.amount, f.nav]);

  // Validation messages
  const isInflow = f.type==='SUBSCRIPTION' || f.type==='ADDITIONAL' || f.type==='SWITCH_IN';
  const isOutflow = f.type==='REDEMPTION' || f.type==='SWITCH_OUT';
  const exceedsAmount = isInflow && capacity && Number(f.amount||0) > capacity.availableAmount + 0.01;
  const exceedsUnits = isInflow && capacity && Number(f.units||0) > capacity.availableUnits + 0.0001;
  const exceedsRedemption = isOutflow && Number(f.units||0) > investorAvailableUnits + 0.0001;
  const insufficientCash = isOutflow && schemeData && Number(f.amount||0) > schemeData.schemeCash + 0.01;
  const cashShortfall = isOutflow && schemeData ? Math.max(0, Number(f.amount||0) - schemeData.schemeCash) : 0;

  function submit(){
    if(!f.investorId || !f.schemeId) {alert('Investor & scheme required'); return;}
    if(!f.amount || !f.nav) {alert('Amount & NAV required'); return;}
    if(exceedsAmount){
      alert(`❌ Subscription exceeds scheme capacity!\n\nAvailable: ${fmtINR(capacity.availableAmount)}\nRequested: ${fmtINR(f.amount)}\nShortfall: ${fmtINR(f.amount - capacity.availableAmount)}\n\nReduce the amount to within available capacity.`);
      return;
    }
    if(exceedsUnits){
      alert(`❌ Unit allocation exceeds available units!\n\nAvailable units: ${fmtNum(capacity.availableUnits,3)}\nRequested: ${fmtNum(f.units,3)}\n\nReduce the units.`);
      return;
    }
    if(exceedsRedemption){
      alert(`❌ Redemption exceeds investor's holding!\n\nInvestor holds: ${fmtNum(investorAvailableUnits,3)} units\nRequested redemption: ${fmtNum(f.units,3)} units\n\nReduce the units to within investor's balance.`);
      return;
    }
    if(insufficientCash){
      const proceed = confirm(
        `⚠ SCHEME CASH INSUFFICIENT\n\n`+
        `The scheme needs ${fmtINR(f.amount)} to pay this redemption, but only has ${fmtINR(schemeData.schemeCash)} in cash.\n\n`+
        `Shortfall: ${fmtINR(cashShortfall)}\n\n`+
        `To fund this redemption, you must FIRST sell portfolio assets (Holdings → Sell) to raise cash.\n\n`+
        `Click OK to save the redemption anyway (it will be recorded as a PAYABLE — pending payout to investor). The investor's units will be reduced but no cash will be paid until the scheme has enough.\n\n`+
        `Click Cancel to go back and sell assets first.`
      );
      if(!proceed) return;
      f.payoutStatus = 'PENDING';
    } else if(isOutflow) {
      f.payoutStatus = 'PAID';
    }
    onSave(f);
  }

  function fillMax(){
    if(isInflow && capacity){
      set('amount', capacity.availableAmount.toFixed(2));
    } else if(isOutflow && invHolding){
      const latest = selScheme ? getLatestNAV(selScheme, store) : {nav:f.nav};
      set('nav', latest.nav);
      set('units', invHolding.units.toFixed(4));
      set('amount', (invHolding.units * latest.nav).toFixed(2));
    }
  }

  return (
    <div className="modal-back" onClick={e=>{if(e.target===e.currentTarget)onClose()}}>
      <div className="modal">
        <div className="modal-head">
          <div className="modal-title">{f.id?'Edit Transaction':'New Transaction'}</div>
          <button className="close-x" onClick={onClose}>×</button>
        </div>
        <div className="modal-body">
          {selScheme && isInflow && (
            <div style={{background:'#f4f7fb',border:'1px solid #d6e0ec',padding:'10px 12px',borderRadius:6,marginBottom:14,fontSize:12}}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
                <span><b>Scheme Capacity — {selScheme.code}</b></span>
                <span className="small">{capacity.pctSubscribed.toFixed(1)}% subscribed</span>
              </div>
              <div style={{height:6,background:'#dfe6ee',borderRadius:3,overflow:'hidden',marginBottom:8}}>
                <div style={{height:'100%',width:Math.min(100,capacity.pctSubscribed)+'%',background:capacity.pctSubscribed>=100?'var(--negative)':'var(--brand)'}}/>
              </div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8,fontSize:11.5}}>
                <div><span className="small">Target Size</span><br/><b>{fmtINR(capacity.targetSize)}</b></div>
                <div><span className="small">Already Subscribed</span><br/><b>{fmtINR(capacity.subscribedAmount)}</b></div>
                <div><span className="small">Available Balance</span><br/><b style={{color:'var(--brand)'}}>{fmtINR(capacity.availableAmount)}</b></div>
                <div><span className="small">Target Units</span><br/><b>{fmtNum(capacity.targetUnits,3)}</b></div>
                <div><span className="small">Issued Units</span><br/><b>{fmtNum(capacity.subscribedUnits,3)}</b></div>
                <div><span className="small">Available Units</span><br/><b style={{color:'var(--brand)'}}>{fmtNum(capacity.availableUnits,3)}</b></div>
              </div>
              <button className="btn btn-sm" style={{marginTop:8}} onClick={fillMax}>Subscribe Full Available</button>

            <div className="field"><label>Scheme *</label>
              <select value={f.schemeId} onChange={e=>set('schemeId',e.target.value)}>
                <option value="">-- Select --</option>
                {store.schemes.map(s=><option key={s.id} value={s.id}>{s.code} — {s.name}</option>)}
              </select></div>
            <div className="field"><label>Amount (₹) *</label>
              <input type="number" step="0.01" value={f.amount} onChange={e=>set('amount',e.target.value)}

              {exceedsAmount && <div className="small" style={{color:'var(--negative)'}}>Exceeds available capacity</div>}</div>
            <div className="field"><label>Applicable NAV *</label>
              <input type="number" step="0.0001" value={f.nav} onChange={e=>set('nav',e.target.value)}/></div>
            <div className="field"><label>Units (auto)</label>
              <input type="number" step="0.0001" value={f.units} onChange={e=>set('units',e.target.value)}
                style={(exceedsUnits||exceedsRedemption)?{borderColor:'var(--negative)',background:'#fbe9e6'}:{}}/>
              {exceedsUnits && <div className="small" style={{color:'var(--negative)'}}>Exceeds available units in scheme</div>}
              {exceedsRedemption && <div className="small" style={{color:'var(--negative)'}}>Exceeds investor's holding</div>}</div>
            <div className="field"><label>Payment Mode</label>
              <select value={f.mode} onChange={e=>set('mode',e.target.value)}>
                <option>NEFT</option><option>RTGS</option><option>IMPS</option>
                <option>UPI</option><option>Cheque</option><option>Cash</option>
              </select></div>
            <div className="field full"><label>Reference No (UTR / Cheque)</label>
              <input value={f.reference} onChange={e=>set('reference',e.target.value)}/></div>
            <div className="field full"><label>Remarks</label>
              <textarea rows="2" value={f.remarks} onChange={e=>set('remarks',e.target.value)}/></div>
          </div>
        </div>
        <div className="modal-foot">
          <button className="btn" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={submit}
            disabled={exceedsAmount||exceedsUnits||exceedsRedemption}>Save Transaction</button>
        </div>
      </div>
    </div>
  );
}

function Passbook({ctx}){

  if(store.investors.length===0){
    return <div className="card"><div className="empty"><div className="empty-icon">☱</div>Add investors first</div></div>;
  }

  const inv = store.investors.find(i=>i.id===invId);
  const holdingsBySch = store.schemes.map(s => {
    const h = getInvestorHolding(invId, s.id, store);
    const sd = computeSchemeAUM(s,store);
    return {scheme:s, ...h, currentValue: h.units * sd.nav, nav: sd.nav};
  }).filter(x=>x.units>0 || x.txns.length>0);

              <h3 style={{margin:0,fontSize:16}}>{inv.name}</h3>
              <div className="small">Folio: <b>{inv.folioNo}</b> · PAN: <b>{inv.pan}</b> · Mobile: {inv.mobile}</div>
              <div className="small">{inv.address}, {inv.city} {inv.pincode}</div>
            </div>
            <div className="spacer"></div>
            <div style={{textAlign:'right'}}>
              <div className="small">Invested</div>
              <div style={{fontSize:16,fontWeight:600}}>{fmtINR(totalInvested)}</div>

                {fmtINR(totalCurrent)}
              </div>
            </div>
          </div>

              <div className="card-title">{scheme.code} — {scheme.name}</div>

            </div>
          </div>
          <div className="tbl-wrap">
            <table className="tbl">
              <thead><tr>
                <th>Date</th><th>Transaction</th>
                <th className="num">Amount</th><th className="num">NAV</th>
                <th className="num">Units</th><th className="num">Bal Units</th>
                <th>Reference</th>
              </tr></thead>
              <tbody>
                {(() => {
                  let bal = 0;
                  return txns.map(t => {
                    const dir = (t.type==='SUBSCRIPTION'||t.type==='ADDITIONAL'||t.type==='SWITCH_IN')?1:-1;
                    bal += dir * Number(t.units||0);
                    return (

      ))}

  );
}
